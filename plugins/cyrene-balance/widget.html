<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>昔涟 · 桌宠</title>
<style>
  :root { --scale: 1; --fs: 1; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: "Microsoft YaHei UI", "Microsoft YaHei", system-ui, sans-serif;
    -webkit-user-select: none;
    user-select: none;
  }
  #shell {
    width: 203px;
    height: 250px;
    transform: scale(var(--scale));
    transform-origin: top left;
    position: relative;
    transition: transform 0.16s ease-out;
  }

  /* ---------- 气泡通用 ---------- */
  .bubble {
    --pad-x: 13px;
    --pad-y: 10px;
    position: absolute;
    left: 3px;
    right: 3px;
    padding: var(--pad-y) var(--pad-x) calc(var(--pad-y) + 1px);
    border-radius: 22px 18px 20px 16px;
    background: linear-gradient(165deg, #fff7fb 0%, #ffeaf4 55%, #ffdcec 100%);
    box-shadow: 0 5px 16px rgba(214, 110, 155, 0.32), inset 0 0 0 1px rgba(255,255,255,0.95);
    z-index: 20;
    transform-origin: top center;
    opacity: 0;
    transform: translateY(-8px) scale(0.85);
    pointer-events: none;
    transition: opacity 0.25s ease, transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .bubble.show {
    opacity: 1;
    transform: translateY(0) scale(1);
    pointer-events: auto;
  }
  .bubble::after {
    content: "";
    position: absolute;
    left: 42%;
    bottom: -9px;
    width: 18px;
    height: 11px;
    margin-left: -9px;
    background: radial-gradient(circle at 50% 0%, #ffdcec 0%, #ffdcec 62%, transparent 68%);
    border-radius: 50%;
  }
  .bubble.low {
    background: linear-gradient(165deg, #fff6f6 0%, #ffe4e7 55%, #ffd4d9 100%);
  }
  .bubble.low::after { background: radial-gradient(circle at 50% 0%, #ffd4d9 0%, #ffd4d9 62%, transparent 68%); }
  .bubble.over-limit {
    background: linear-gradient(165deg, #fff0f5 0%, #ffd0de 52%, #ffb1c7 100%);
    box-shadow: 0 0 0 2px rgba(255, 118, 162, 0.38), 0 8px 20px rgba(255, 118, 162, 0.3);
    animation: limitPulse 1.8s ease-in-out infinite;
  }
  .bubble.over-limit::after { background: radial-gradient(circle at 50% 0%, #ffb1c7 0%, #ffb1c7 62%, transparent 68%); }
  .over-limit .line { color: #a3254a; font-weight: 600; }
  @keyframes limitPulse {
    0%, 100% { box-shadow: 0 0 0 2px rgba(255, 118, 162, 0.38), 0 8px 20px rgba(255, 118, 162, 0.3); }
    50% { box-shadow: 0 0 0 4px rgba(255, 118, 162, 0.18), 0 10px 26px rgba(255, 118, 162, 0.42); }
  }
  .bubble.pop { animation: bubblePop 0.42s cubic-bezier(0.34, 1.56, 0.64, 1); }
  @keyframes bubblePop {
    0% { transform: translateY(-5px) scale(0.9); }
    55% { transform: translateY(0) scale(1.05); }
    100% { transform: translateY(0) scale(1); }
  }

  /* 位置档位 */
  .bubble.place-top { top: 4px; bottom: auto; transform-origin: top center; }
  .bubble.place-middle { top: 46px; bottom: auto; transform-origin: top center; }
  .bubble.place-bottom { top: auto; bottom: 8px; transform-origin: bottom center; }
  .bubble.place-bottom::after { display: none; }

  /* 尺寸档位：只改留白和圆角，字号交给字号设置 */
  .bubble.size-compact { --pad-x: 8px; --pad-y: 6px; border-radius: 16px 13px 15px 12px; }
  .bubble.size-normal { --pad-x: 13px; --pad-y: 10px; }
  .bubble.size-roomy { --pad-x: 17px; --pad-y: 15px; border-radius: 26px 20px 24px 18px; }
  .bubble.size-xlarge { --pad-x: 21px; --pad-y: 20px; border-radius: 30px 24px 28px 22px; }

  .line {
    font-size: calc(11px * var(--fs));
    color: #a06780;
    line-height: 1.5;
    min-height: calc(17px * var(--fs));
    white-space: pre-wrap;
    word-break: break-word;
  }
  .low .line { color: #b04a5c; }

  .amount {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 0 3px;
    margin-top: 3px;
    color: #7a4258;
  }
  .amount .num {
    font-size: clamp(20px, calc(28px * var(--fs)), 40px);
    font-weight: 700;
    letter-spacing: -0.5px;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .amount .unit { font-size: calc(10px * var(--fs)); color: #b57e94; }

  .meta {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 4px;
    min-width: 0;
    font-size: calc(8.5px * var(--fs));
    color: #a0748a;
  }
  .meta .txt { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pill {
    font-size: calc(8px * var(--fs));
    line-height: 1.6;
    padding: 0 6px;
    border-radius: 7px;
    background: #d9f2e6;
    color: #3f8f6d;
    flex: 0 0 auto;
  }
  .pill.peak { background: #ffe0d6; color: #c25a35; }

  /* ---------- 台词气泡：只放一句话，小表情嵌在右侧 ---------- */
  .bubble.talk { padding: var(--pad-y) var(--pad-x); }
  .talk-row {
    display: flex;
    align-items: center;
    gap: 8px;
    min-height: var(--sticker-size, 42px);
  }
  .bubble.talk .line {
    flex: 1 1 auto;
    min-width: 0;
    min-height: 0;
    /* 台词字号独立，不跟着余额字号缩放 */
    font-size: var(--talk-fs, 12px);
    line-height: 1.45;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
    word-break: break-word;
  }

  /* ---------- 角标表情 ---------- */
  .sticker {
    width: var(--sticker-size, 42px);
    height: var(--sticker-size, 42px);
    object-fit: contain;
    opacity: 0;
    transform: scale(0.55) translateY(6px);
    transform-origin: center;
    transition: opacity 0.24s ease, transform 0.38s cubic-bezier(0.34, 1.56, 0.64, 1);
    pointer-events: none;
    filter: drop-shadow(0 2px 5px rgba(180, 80, 120, 0.28));
    -webkit-user-drag: none;
  }
  .sticker.on { opacity: 1; transform: scale(1) translateY(0); }
  /* 在气泡里：跟着文字一起排，不再压到立绘 */
  .sticker.in-bubble {
    position: relative;
    flex: 0 0 var(--sticker-size, 42px);
    z-index: 1;
  }
  /* 在窗口角落：独立定位 */
  .sticker:not(.in-bubble) {
    position: absolute;
    z-index: 25;
  }
  .sticker.place-corner { right: -2px; bottom: 2px; transform-origin: bottom right; }
  .sticker.place-bl { left: -2px; bottom: 2px; transform-origin: bottom left; }
  .sticker.place-tl { left: -2px; top: 2px; transform-origin: top left; }

  /* ---------- 角色：静态立绘 + 呼吸律动 ---------- */
  #sprite {
    position: absolute;
    left: 50%;
    bottom: 8px;
    width: 180px;
    height: 180px;
    transform: translateX(-50%) scale(var(--sprite-scale, 1));
    transform-origin: bottom center;
    cursor: grab;
    z-index: 2;
    transition: transform 0.34s cubic-bezier(0.34, 1.4, 0.64, 1);
  }
  #sprite:active { cursor: grabbing; }
  #sprite.pressed {
    transform: translateX(-50%) scale(calc(var(--sprite-scale, 1) * 0.94), calc(var(--sprite-scale, 1) * 0.8));
    transition: transform 0.07s ease;
  }
  #sprite img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    object-position: bottom center;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.22s ease;
    transform-origin: bottom center;
    filter: drop-shadow(0 5px 9px rgba(185, 88, 128, 0.3));
    -webkit-user-drag: none;
  }
  #sprite img.on { opacity: 1; }
  #sprite #base { opacity: 1; animation: breathe 4.6s ease-in-out infinite; }
  #sprite img.on:not(#base) { animation: breathe 4.6s ease-in-out infinite; }
  /* 表情上场时收起底图，避免两张立绘叠在一起 */
  #sprite.showing-face #base { opacity: 0; }
  @keyframes breathe {
    0%, 100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-2px) scale(1.015); }
  }

  /* ---------- 当前任务气泡 ---------- */
  .bubble.task {
    padding: 9px 11px 8px;
    z-index: 6;
    cursor: pointer;
    user-select: none;
  }
  .task-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    font-size: 11px;
  }
  .task-title { font-weight: 700; color: #8a4b63; letter-spacing: 0.04em; }
  .task-count { font-size: 10px; color: #b07088; font-variant-numeric: tabular-nums; }
  .task-bar {
    margin-top: 6px;
    height: 4px;
    border-radius: 2px;
    background: rgba(255, 160, 190, 0.28);
    overflow: hidden;
  }
  .task-bar i {
    display: block;
    height: 100%;
    width: 0%;
    border-radius: 2px;
    background: linear-gradient(90deg, #ff9fc0, #ff6f9f);
    transition: width 0.35s ease;
  }
  .task-now {
    margin-top: 6px;
    font-size: 11px;
    line-height: 1.45;
    color: #7a4a5e;
    word-break: break-word;
  }
  .task-now.done { color: #4f8f74; }
  .task-list {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.28s ease;
  }
  .bubble.task.expanded .task-list {
    max-height: 132px;
    overflow-y: auto;
    margin-top: 5px;
  }
  .task-item {
    display: flex;
    gap: 5px;
    font-size: 10px;
    line-height: 1.5;
    color: #8b5b6e;
    padding: 2px 0;
  }
  .task-item .dot {
    flex: 0 0 auto;
    width: 5px;
    height: 5px;
    margin-top: 6px;
    border-radius: 50%;
    background: #e7b4c6;
  }
  .task-item.in_progress .dot {
    background: #ff6f9f;
    box-shadow: 0 0 0 3px rgba(255, 111, 159, 0.18);
  }
  .task-item.in_progress { color: #b23a69; font-weight: 600; }
  .task-item.completed { color: #9aa8a0; text-decoration: line-through; }
  .task-item.completed .dot { background: #9fd0b6; }
  .task-item.cancelled { opacity: 0.5; }
  .task-foot {
    margin-top: 4px;
    font-size: 9px;
    color: #b58aa0;
    text-align: right;
  }

  /* ---------- 卡片层：提问 / 审批 ---------- */
  #cardFrame {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    background: transparent;
    display: none;
    z-index: 60;
  }
  body.card-mode #shell { display: none; }
</style>
</head>

      applyPose(poseIndex + 1);

    if (h < 12) return { face: "confident", mood: "normal", t: "上午的时间，最适合做点正事" };
    if (h < 14) return { face: "calm", mood: "eat", t: "到饭点啦，记得好好吃饭" };
    if (h < 18) return { face: "confident", mood: "normal", t: "下午好，进度还顺利吗？" };
    if (h < 22) return { face: "love", mood: "shy", t: "晚上好呀，今天辛苦啦" };
    return { face: "calm", mood: "tired", t: "夜深了，别熬太久哦" };
  }

  /* ---------- 用户配置（右键菜单可调） ---------- */
  const CONFIG = {
    stickerDuration: 3.4,
    stickerPlacement: "inside",
    stickerSize: 42,
    bubbleSize: "normal",
    bubbleMode: "rotate",
    bubblePlace: "top",
    bubbleFont: 1,
    talkFont: 12,
    rotateSec: 12,
  };

  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
  function fill(t, d) {
    const spent = Number(d.spent) || 0;
    const limit = Number(d.budget) || 0;
    return t
      .replace("{total}", Number(d.total).toFixed(2))
      .replace("{spent}", spent.toFixed(2))
      .replace("{limit}", limit > 0 ? limit.toFixed(2) : "—")
      .replace("{remain}", limit > 0 ? Math.max(0, limit - spent).toFixed(2) : "—")
      .replace("{ratio}", limit > 0 ? String(Math.round((spent / limit) * 100)) : "—")
      .replace("{peak}", d.peak && d.peak.short ? d.peak.short : "谷");
  }
  function chooseLine(d) {
    if (CONFIG.bubbleMode === "today") return fill(pick(LINES.today), d);
    if (CONFIG.bubbleMode === "balance") return fill(pick(LINES.balanceOnly), d);
    if (d.overBudget) return fill(pick(LINES.overLimit), d);
    if (d.low) return fill(pick(LINES.low), d);
    return fill(pick(LINES.normal), d);
  }

  /* ---------- 字号 / 尺寸 / 位置 ---------- */
  function applySizes() {
    document.documentElement.style.setProperty("--fs", String(CONFIG.bubbleFont));
    document.documentElement.style.setProperty("--talk-fs", CONFIG.talkFont + "px");
    document.documentElement.style.setProperty("--sticker-size", CONFIG.stickerSize + "px");
    [infoBubble, talkBubble].forEach((el) => {
      el.classList.remove(
        "size-compact", "size-normal", "size-roomy", "size-xlarge",
        "place-top", "place-middle", "place-bottom",
      );
      el.classList.add("size-" + CONFIG.bubbleSize);
      el.classList.add("place-" + CONFIG.bubblePlace);
    });
    fitSprite();
  }

  /* ---------- 贴纸挂载：气泡内 / 窗口角落 ---------- */
  function mountSticker() {
    const place = CONFIG.stickerPlacement;
    const inside = place === "inside";
    const parent = inside ? talkRow : shell;
    if (sticker.parentElement !== parent) parent.appendChild(sticker);
    sticker.classList.toggle("in-bubble", inside);
    sticker.classList.remove("place-inside", "place-corner", "place-bl", "place-tl");
    sticker.classList.add("place-" + place);
    sticker.style.top = "";
    sticker.style.left = "";
    sticker.style.right = "";
    sticker.style.bottom = "";
  }

  function showSticker(mood) {
    const pool = EMOJI[mood] || EMOJI.normal;
    sticker.src = "assets/emoji/" + pick(pool);
    sticker.classList.remove("on");
    void sticker.offsetWidth;
    sticker.classList.add("on");
    mountSticker();
    if (stickerTimer) clearTimeout(stickerTimer);
    stickerTimer = setTimeout(
      () => sticker.classList.remove("on"),
      Math.round(Math.max(0.8, CONFIG.stickerDuration) * 1000),
    );
  }

  /* ---------- 表情：透明立绘叠层，到期回到默认 ---------- */
  function setFace(name, ms) {
    const img = FACES[name];
    if (!img) return;
    Object.values(FACES).forEach((f) => f.classList.remove("on"));
    img.classList.add("on");
    sprite.classList.add("showing-face");
    if (faceTimer) clearTimeout(faceTimer);
    faceTimer = setTimeout(() => {
      Object.values(FACES).forEach((f) => f.classList.remove("on"));
      sprite.classList.remove("showing-face");
    }, ms || 2400);
  }

  /* 气泡占多高，立绘就往里让多少，避免压住角色 */
  function fitSprite() {
    const shown = [taskBubble, infoBubble, talkBubble].find((b) => b.classList.contains("show"));
    const h = shown ? shown.offsetHeight : 0;
    const room = 250 - 8 - (4 + h + 6);
    const s = Math.max(0.56, Math.min(1, room / 180));
    document.documentElement.style.setProperty("--sprite-scale", s.toFixed(3));
  }

  /* ---------- 三气泡互斥 ---------- */
  function showPanel(el, ms) {
    [infoBubble, talkBubble, taskBubble].forEach((b) => {
      if (b !== el) b.classList.remove("show", "pop");
    });
    activeBubble = el;
    el.classList.add("show");
    el.classList.remove("pop");
    void el.offsetWidth;
    el.classList.add("pop");
    if (bubbleTimer) clearTimeout(bubbleTimer);
    bubbleTimer = setTimeout(() => {
      el.classList.remove("show");
      fitSprite();
    }, ms || 5000);
    requestAnimationFrame(() => {
      mountSticker();
      fitSprite();
    });
  }

  function panelMs() {
    return Math.max(3500, Math.min(7000, Math.round(CONFIG.rotateSec * 500)));
  }

  function presentInfo(force) {
    if (!lastData || !lastData.ok) return;
    if (!force && CONFIG.bubbleMode === "talk") return;
    const text = chooseLine(lastData);
    infoLine.textContent = text;
    showPanel(infoBubble, panelMs());
  }

  function presentTalk(text, face, mood) {
    const line = text || pick(pick(GROUPS).lines);
    talkLine.textContent = line;
    if (face) setFace(face, 2600);
    showPanel(talkBubble, panelMs());
    if (mood) showSticker(mood);
  }

  function saySomething() {
    // 任务气泡正在展示时先让位，别把进度压掉
    if (taskBubble.classList.contains("show") && taskItems.length) return;
    const g = pick(GROUPS);
    presentTalk(pick(g.lines), g.face, g.mood);
    playSound("assets/Ya2.mp3", 0.42);
  }

  /* ---------- 当前任务气泡 ---------- */
  function renderTask(state) {
    const items = state && Array.isArray(state.items) ? state.items : [];
    const previousDone = taskItems.filter((item) => item.status === "completed").length;
    const previousTotal = taskItems.length;

    taskItems = items;
    taskWorking = Boolean(state && state.working);

    const total = items.length;
    const done = items.filter((item) => item.status === "completed").length;
    const ended = items.filter((item) => item.status === "cancelled").length;
    const active = items.find((item) => item.status === "in_progress");

    taskCount.textContent = total ? done + "/" + total : "0/0";
    taskBar.style.width = total ? Math.round(((done + ended) / total) * 100) + "%" : "0%";

    if (!total) {
      taskNow.textContent = taskWorking ? "正在想接下来做什么…" : "还没有开始呢";
      taskNow.classList.remove("done");
    } else if (done + ended >= total) {
      taskNow.textContent = "都做完啦，要不要歇一会儿？";
      taskNow.classList.add("done");
    } else if (active) {
      taskNow.textContent = active.content;
      taskNow.classList.remove("done");
    } else {
      const next = items.find((item) => item.status === "pending");
      taskNow.textContent = next ? "接下来：" + next.content : "准备中…";
      taskNow.classList.remove("done");
    }

    taskList.innerHTML = "";
    for (const item of items) {
      const row = document.createElement("div");
      row.className = "task-item " + (item.status || "pending");
      const dot = document.createElement("span");
      dot.className = "dot";
      const text = document.createElement("span");
      text.textContent = item.content || "";
      row.appendChild(dot);
      row.appendChild(text);
      taskList.appendChild(row);
    }

    showPanel(taskBubble, Math.max(9000, panelMs()));
    fitSprite();

    // 全部完成时给个小庆祝，只在“刚好做完”那一次触发
    if (total > 0 && done + ended >= total && (previousDone + previousTotal > 0) && previousDone < total) {
      setFace("love", 3600);
      showSticker("happy");
      playSound("assets/task-end-a.wav", 0.42);
    }
  }

  function setCardMode(on) {
    document.body.classList.toggle("card-mode", on);
    if (on) {
      if (!cardFrame.getAttribute("src")) cardFrame.setAttribute("src", "card.html");
      cardFrame.style.display = "block";
    } else {
      cardFrame.style.display = "none";
    }
  }

  function openTaskPanel() {
    ipcRenderer.invoke(CH + "task-open-main").catch(() => {});
  }

  let taskPressTimer = null;
  let taskLongPressed = false;

  taskBubble.addEventListener("pointerdown", () => {
    taskLongPressed = false;
    if (taskPressTimer) clearTimeout(taskPressTimer);
    taskPressTimer = setTimeout(() => {
      taskPressTimer = null;
      taskLongPressed = true;
      openTaskPanel();
    }, 620);
  });

  ["pointerup", "pointerleave", "pointercancel"].forEach((name) => {
    taskBubble.addEventListener(name, () => {
      if (taskPressTimer) {
        clearTimeout(taskPressTimer);
        taskPressTimer = null;
      }
    });
  });

  taskBubble.addEventListener("click", (event) => {
    event.stopPropagation();
    if (taskLongPressed) {
      taskLongPressed = false;
      return;
    }
    if (!taskItems.length) return;
    taskExpanded = !taskExpanded;
    taskBubble.classList.toggle("expanded", taskExpanded);
    fitSprite();
  });

  taskBubble.addEventListener("dblclick", (event) => {
    event.stopPropagation();
    openTaskPanel();
  });

  ipcRenderer.on("balance-todo", (_event, state) => renderTask(state));
  ipcRenderer.on("balance-card:show", () => setCardMode(true));
  ipcRenderer.on("balance-card:hide", () => setCardMode(false));

  function startRotate() {
    if (rotateTimer) clearInterval(rotateTimer);
    rotateTimer = null;
    if (CONFIG.bubbleMode !== "rotate") return;
    const gap = Math.max(5, CONFIG.rotateSec) * 1000;
    rotateTimer = setInterval(() => {
      if (CONFIG.bubbleMode !== "rotate") return;
      if (!lastData || !lastData.ok) return;
      rotateTick += 1;
      if (rotateTick % 4 === 0) {
        const greet = hourLine();
        presentTalk(greet.t, greet.face, greet.mood);
      } else if (activeBubble === infoBubble) saySomething();
      else if (activeBubble === taskBubble) return;
      else presentInfo(true);
    }, gap);
  }

  /* ---------- 数字滚动 ---------- */
  function rollTo(target) {
    const from = shown;
    const to = Number(target) || 0;
    if (Math.abs(to - from) < 0.001) { shown = to; numEl.textContent = to.toFixed(2); return; }
    const start = performance.now();
    const dur = 900;
    if (raf) cancelAnimationFrame(raf);
    const step = (now) => {
      const t = Math.min(1, (now - start) / dur);
      const eased = 1 - Math.pow(1 - t, 3);
      numEl.textContent = (from + (to - from) * eased).toFixed(2);
      if (t < 1) raf = requestAnimationFrame(step);
      else { shown = to; numEl.textContent = to.toFixed(2); }
    };
    raf = requestAnimationFrame(step);
  }

  /* ---------- 渲染 ---------- */
  let wasLow = false;
  let wasOverBudget = false;
  function render(d) {
    if (!d) return;
    lastData = d;
    if (!d.ok) {
      presentTalk(d.error || "查询失败", "serious", "sad");
      return;
    }
    const mode = CONFIG.bubbleMode;
    const spent = Number(d.spent) || 0;
    const limit = Number(d.budget) || 0;
    const recharge = Number(d.recharge) || 0;
    const remain = limit > 0 ? Math.max(0, limit - spent) : 0;

    rollTo(mode === "today" ? spent : d.total);

    let meta;
    if (mode === "today") {
      meta = limit > 0 ? "额度 " + limit.toFixed(2) + " · 还剩 " + remain.toFixed(2) : "今日额度还没设置";
    } else if (mode === "balance") {
      meta = "今日用掉 " + spent.toFixed(2) + " 元";
    } else {
      meta = "今天用掉 " + spent.toFixed(2) + " 元";
      if (recharge > 0) meta += " · 充入 " + recharge.toFixed(2);
      if (d.overBudget) meta = "已超额度 · 用掉 " + spent.toFixed(2);
      else if (limit > 0) meta = "今天 " + spent.toFixed(2) + " / " + limit.toFixed(2);
    }
    metaEl.textContent = meta;

    peakEl.textContent = d.peak && d.peak.short ? d.peak.short : "谷";
    peakEl.classList.toggle("peak", Boolean(d.peak && d.peak.peak));

    const low = Boolean(d.low);
    const over = Boolean(d.overBudget);
    const lowTurn = low && !wasLow;
    const overTurn = over && !wasOverBudget && !lowTurn;
    if (lowTurn || overTurn) {
      if (overTurn) {
        playSound("assets/task-end-a.wav", 0.62);
        setTimeout(() => playSound("assets/Ya2.mp3", 0.5), 320);
      } else {
        playSound("assets/task-end-a.wav", 0.5);
      }
      const text = lowTurn ? fill(pick(LINES.low), d) : fill(pick(LINES.overLimit), d);
      infoLine.textContent = text;
      setFace("serious", 3200);
      showSticker("low");
      showPanel(infoBubble, overTurn ? Math.max(6000, panelMs()) : panelMs());
    }
    wasLow = low;
    wasOverBudget = over;

    const totalNow = Number(d.total) || 0;
    if (prevTotal !== null && Date.now() - lastCostTalkAt > 90000) {
      const delta = totalNow - prevTotal;
      if (delta <= -0.01) {
        lastCostTalkAt = Date.now();
        presentTalk("刚刚用掉 " + Math.abs(delta).toFixed(2) + " 元，人家记在小本本上了", "serious", "think");
      } else if (delta >= 0.01) {
        lastCostTalkAt = Date.now();
        presentTalk("充进来 " + delta.toFixed(2) + " 元啦，先替你存着♪", "love", "happy");
      }
    }
    prevTotal = totalNow;

    const peakNow = d.peak && d.peak.short ? d.peak.short : "";
    if (prevPeak && peakNow && prevPeak !== peakNow) {
      presentTalk(peakNow === "峰" ? "进入峰价时段了，用之前先想一想哦" : "谷价时段到啦，现在用最划算♪", "calm", "normal");
    }
    prevPeak = peakNow;
    infoBubble.classList.toggle("low", low);
    infoBubble.classList.toggle("over-limit", over);

    if (activeBubble === infoBubble && infoBubble.classList.contains("show")) {
      const text = chooseLine(d);
      infoLine.textContent = text;
    }
    if (infoBubble.classList.contains("show")) fitSprite();
  }

  function applyScale(value) {
    scale = value;
    document.documentElement.style.setProperty("--scale", String(value));
  }

  /* ---------- 声音 ---------- */
  function playSound(src, vol) {
    try {
      const audio = new Audio(src);
      audio.volume = vol || 0.55;
      audio.play().catch(() => {});
    } catch (e) {}
  }

  /* ---------- 按压 Q 弹 + 拖拽 ---------- */
  let dragging = false;
  let moved = false;
  let startX = 0, startY = 0, lastX = 0, lastY = 0;
  let pendingDx = 0, pendingDy = 0, rafPending = false;

  function flushMove() {
    rafPending = false;
    if (!pendingDx && !pendingDy) return;
    const dx = pendingDx, dy = pendingDy;
    pendingDx = 0; pendingDy = 0;
    ipcRenderer.invoke(CH + "moveBy", { dx, dy }).catch(() => {});
  }

  sprite.addEventListener("pointerdown", (e) => {
    dragging = true;
    moved = false;
    startX = e.screenX; startY = e.screenY;
    lastX = e.screenX; lastY = e.screenY;
    sprite.classList.add("pressed");
    playSound("assets/Ya1.mp3", 0.5);
    try { sprite.setPointerCapture(e.pointerId); } catch (err) {}
  });

  sprite.addEventListener("pointermove", (e) => {
    if (!dragging) return;
    const dx = e.screenX - lastX;
    const dy = e.screenY - lastY;
    lastX = e.screenX; lastY = e.screenY;
    if (Math.abs(e.screenX - startX) > 4 || Math.abs(e.screenY - startY) > 4) moved = true;
    if (moved && (dx || dy)) {
      pendingDx += dx; pendingDy += dy;
      if (!rafPending) { rafPending = true; requestAnimationFrame(flushMove); }
    }
  });

  function endDrag() {
    if (!dragging) return;
    dragging = false;
    sprite.classList.remove("pressed");
    playSound("assets/Ya2.mp3", 0.5);
    if (!moved) {
      setFace("rua", 780);
      saySomething();
    }
  }
  sprite.addEventListener("pointerup", endDrag);
  sprite.addEventListener("pointercancel", () => {
    dragging = false;
    sprite.classList.remove("pressed");
  });

  sprite.addEventListener("contextmenu", (e) => {
    e.preventDefault();
    ipcRenderer.invoke(CH + "showMenu").catch(() => {});
  });

  ipcRenderer.on("menu-action", (e, type) => {
    if (type === "talk") { setFace("rua", 780); saySomething(); }
    else if (type === "next-pose") nextPose();
    else if (type === "zoom-in") changeScale(1);
    else if (type === "zoom-out") changeScale(-1);
    else if (type === "refresh") load(true);
    else if (type === "custom-limit") {
      const current = lastData && Number(lastData.budget) > 0 ? String(Number(lastData.budget)) : "30";
      const input = window.prompt("今日额度上限（元，填 0 表示关闭提醒）", current);
      if (input === null) return;
      const value = Number(input);
      if (!Number.isFinite(value) || value < 0) return;
      ipcRenderer
        .invoke(CH + "setLimit", value)
        .then((res) => {
          if (res && res.payload) render(res.payload);
        })
        .catch(() => {});
    }
    else if (type === "close") ipcRenderer.invoke(CH + "close").catch(() => {});
  });

  ipcRenderer.on("config-changed", () => {
    void loadConfig();
  });

  /* ---------- 配置 ---------- */
  async function loadConfig() {
    try {
      const c = await ipcRenderer.invoke(CH + "config");
      if (c) {
        if (typeof c.stickerDuration === "number") CONFIG.stickerDuration = c.stickerDuration;
        if (c.stickerPlacement) CONFIG.stickerPlacement = c.stickerPlacement;
        if (c.bubbleSize) CONFIG.bubbleSize = c.bubbleSize;
        if (c.bubbleMode) CONFIG.bubbleMode = c.bubbleMode;
        if (c.bubblePlace) CONFIG.bubblePlace = c.bubblePlace;
        if (typeof c.bubbleFont === "number") CONFIG.bubbleFont = c.bubbleFont;
        if (typeof c.talkFont === "number") CONFIG.talkFont = c.talkFont;
        if (typeof c.stickerSize === "number") CONFIG.stickerSize = c.stickerSize;
        if (typeof c.rotateSec === "number") CONFIG.rotateSec = c.rotateSec;
        if (typeof c.poseRotate === "boolean") CONFIG.poseRotate = c.poseRotate;
        if (typeof c.poseSec === "number") CONFIG.poseSec = c.poseSec;
      }
    } catch (e) {}
    applySizes();
    mountSticker();
    startRotate();
    schedulePose();
    if (lastData) render(lastData);
  }

  /* ---------- 数据 / 缩放 ---------- */
  async function load(refresh) {
    try {
      const data = await ipcRenderer.invoke(CH + (refresh ? "refresh" : "get"));
      render(data);
    } catch (e) {
      presentTalk("读取失败", "serious", "sad");
    }
  }
  async function changeScale(dir) {
    const idx = SCALES.indexOf(scale);
    const next = SCALES[Math.max(0, Math.min(SCALES.length - 1, (idx < 0 ? 2 : idx) + dir))];
    if (next === scale) return;
    try {
      const applied = await ipcRenderer.invoke(CH + "setScale", next);
      applyScale(typeof applied === "number" ? applied : next);
    } catch (e) {
      applyScale(next);
    }
  }

  /* ---------- 启动 ---------- */
  (async () => {
    try {
      const s = await ipcRenderer.invoke(CH + "scale");
      if (typeof s === "number" && s > 0) applyScale(s);
    } catch (e) {}
    await loadConfig();
    await load(false);
    setFace("calm", 1900);
    setTimeout(() => {
      presentInfo(true);
      showSticker("greet");
    }, 500);
  })();

  setInterval(() => load(false), 30000);

  setInterval(() => {
    if (lastData && lastData.ok && !infoBubble.classList.contains("show")) {
      const text = chooseLine(lastData);
      infoLine.textContent = text;
    }
  }, 15000);

  setInterval(() => {
    if (["info", "today", "balance"].includes(CONFIG.bubbleMode)) return;
    if (!lastData) return;
    const q = pick(QUESTIONS);
    presentTalk(q.t, q.face, q.mood);
  }, 6 * 60 * 1000);

  setTimeout(() => {
    if (lastData) {
      const q = pick(QUESTIONS);
      presentTalk(q.t, q.face, q.mood);
    }
  }, 90 * 1000);
</script>
</body>
