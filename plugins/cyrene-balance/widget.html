<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>昔涟 · 桌宠</title>
<style>
  :root { --scale: 1; --fs: 1; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: "Microsoft YaHei UI", "Microsoft YaHei", system-ui, sans-serif;
    -webkit-user-select: none;
    user-select: none;
  }
  #shell {
    width: 203px;
    height: 250px;
    transform: scale(var(--scale));
    transform-origin: top left;
    position: relative;
    transition: transform 0.16s ease-out;
  }

  /* ---------- 气泡通用 ---------- */
  .bubble {
    --pad-x: 13px;
    --pad-y: 10px;
    position: absolute;
    left: 3px;
    right: 3px;
    padding: var(--pad-y) var(--pad-x) calc(var(--pad-y) + 1px);
    border-radius: 22px 18px 20px 16px;
    background: linear-gradient(165deg, #fff7fb 0%, #ffeaf4 55%, #ffdcec 100%);
    box-shadow: 0 5px 16px rgba(214, 110, 155, 0.32), inset 0 0 0 1px rgba(255,255,255,0.95);
    z-index: 20;
    transform-origin: top center;
    opacity: 0;
    transform: translateY(-8px) scale(0.85);
    pointer-events: none;
    transition: opacity 0.25s ease, transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .bubble.show {
    opacity: 1;
    transform: translateY(0) scale(1);
    pointer-events: auto;
  }
  .bubble::after {
    content: "";
    position: absolute;
    left: 42%;
    bottom: -9px;
    width: 18px;
    height: 11px;
    margin-left: -9px;
    background: radial-gradient(circle at 50% 0%, #ffdcec 0%, #ffdcec 62%, transparent 68%);
    border-radius: 50%;
  }
  .bubble.low {
    background: linear-gradient(165deg, #fff6f6 0%, #ffe4e7 55%, #ffd4d9 100%);
  }
  .bubble.low::after { background: radial-gradient(circle at 50% 0%, #ffd4d9 0%, #ffd4d9 62%, transparent 68%); }
  .bubble.pop { animation: bubblePop 0.42s cubic-bezier(0.34, 1.56, 0.64, 1); }
  @keyframes bubblePop {
    0% { transform: translateY(-5px) scale(0.9); }
    55% { transform: translateY(0) scale(1.05); }
    100% { transform: translateY(0) scale(1); }
  }

  /* 位置档位 */
  .bubble.place-top { top: 4px; bottom: auto; transform-origin: top center; }
  .bubble.place-middle { top: 46px; bottom: auto; transform-origin: top center; }
  .bubble.place-bottom { top: auto; bottom: 8px; transform-origin: bottom center; }
  .bubble.place-bottom::after { display: none; }

  /* 尺寸档位：只改留白和圆角，字号交给字号设置 */
  .bubble.size-compact { --pad-x: 8px; --pad-y: 6px; border-radius: 16px 13px 15px 12px; }
  .bubble.size-normal { --pad-x: 13px; --pad-y: 10px; }
  .bubble.size-roomy { --pad-x: 17px; --pad-y: 15px; border-radius: 26px 20px 24px 18px; }
  .bubble.size-xlarge { --pad-x: 21px; --pad-y: 20px; border-radius: 30px 24px 28px 22px; }

  .line {
    font-size: calc(11px * var(--fs));
    color: #a06780;
    line-height: 1.5;
    min-height: calc(17px * var(--fs));
    white-space: pre-wrap;
    word-break: break-word;
  }
  .low .line { color: #b04a5c; }

  .amount {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 0 3px;
    margin-top: 3px;
    color: #7a4258;
  }
  .amount .num {
    font-size: clamp(20px, calc(28px * var(--fs)), 40px);
    font-weight: 700;
    letter-spacing: -0.5px;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .amount .unit { font-size: calc(10px * var(--fs)); color: #b57e94; }

  .meta {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 4px;
    min-width: 0;
    font-size: calc(8.5px * var(--fs));
    color: #a0748a;
  }
  .meta .txt { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pill {
    font-size: calc(8px * var(--fs));
    line-height: 1.6;
    padding: 0 6px;
    border-radius: 7px;
    background: #d9f2e6;
    color: #3f8f6d;
    flex: 0 0 auto;
  }
  .pill.peak { background: #ffe0d6; color: #c25a35; }

  /* ---------- 台词气泡：只放一句话，小表情嵌在右侧 ---------- */
  .bubble.talk { padding: var(--pad-y) var(--pad-x); }
  .talk-row {
    display: flex;
    align-items: center;
    gap: 8px;
    min-height: var(--sticker-size, 42px);
  }
  .bubble.talk .line {
    flex: 1 1 auto;
    min-width: 0;
    min-height: 0;
    /* 台词字号独立，不跟着余额字号缩放 */
    font-size: var(--talk-fs, 12px);
    line-height: 1.45;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
    word-break: break-word;
  }

  /* ---------- 角标表情 ---------- */
  .sticker {
    width: var(--sticker-size, 42px);
    height: var(--sticker-size, 42px);
    object-fit: contain;
    opacity: 0;
    transform: scale(0.55) translateY(6px);
    transform-origin: center;
    transition: opacity 0.24s ease, transform 0.38s cubic-bezier(0.34, 1.56, 0.64, 1);
    pointer-events: none;
    filter: drop-shadow(0 2px 5px rgba(180, 80, 120, 0.28));
    -webkit-user-drag: none;
  }
  .sticker.on { opacity: 1; transform: scale(1) translateY(0); }
  /* 在气泡里：跟着文字一起排，不再压到立绘 */
  .sticker.in-bubble {
    position: relative;
    flex: 0 0 var(--sticker-size, 42px);
    z-index: 1;
  }
  /* 在窗口角落：独立定位 */
  .sticker:not(.in-bubble) {
    position: absolute;
    z-index: 25;
  }
  .sticker.place-corner { right: -2px; bottom: 2px; transform-origin: bottom right; }
  .sticker.place-bl { left: -2px; bottom: 2px; transform-origin: bottom left; }
  .sticker.place-tl { left: -2px; top: 2px; transform-origin: top left; }

  /* ---------- 角色：静态立绘 + 呼吸律动 ---------- */
  #sprite {
    position: absolute;
    left: 50%;
    bottom: 8px;
    width: 180px;
    height: 180px;
    transform: translateX(-50%) scale(var(--sprite-scale, 1));
    transform-origin: bottom center;
    cursor: grab;
    z-index: 2;
    transition: transform 0.34s cubic-bezier(0.34, 1.4, 0.64, 1);
  }
  #sprite:active { cursor: grabbing; }
  #sprite.pressed {
    transform: translateX(-50%) scale(calc(var(--sprite-scale, 1) * 0.94), calc(var(--sprite-scale, 1) * 0.8));
    transition: transform 0.07s ease;
  }
  #sprite img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    object-position: bottom center;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.22s ease;
    transform-origin: bottom center;
    filter: drop-shadow(0 5px 9px rgba(185, 88, 128, 0.3));
    -webkit-user-drag: none;
  }
  #sprite img.on { opacity: 1; }
  #sprite #base { opacity: 1; animation: breathe 4.6s ease-in-out infinite; }
  #sprite img.on:not(#base) { animation: breathe 4.6s ease-in-out infinite; }
  /* 表情上场时收起底图，避免两张立绘叠在一起 */
  #sprite.showing-face #base { opacity: 0; }
  @keyframes breathe {
    0%, 100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-2px) scale(1.015); }
  }
</style>
</head>
<body>
  <div id="shell">
    <div class="bubble info place-top" id="infoBubble">
      <div class="line" id="infoLine">…</div>
      <div class="amount">
        <span class="num" id="num">0.00</span>
        <span class="unit">元</span>
        <span class="meta">
          <span class="txt" id="meta">--</span>
          <span class="pill" id="peak">谷</span>
        </span>
      </div>
    </div>

    <div class="bubble talk place-top" id="talkBubble">
      <div class="talk-row" id="talkRow">
        <div class="line" id="talkLine">…</div>
        <img class="sticker in-bubble" id="sticker" alt="" />
      </div>
    </div>

    <div id="sprite">
      <img id="base" src="assets/frame-01.png" alt="昔涟" draggable="false" />
      <img class="face" id="faceCalm" src="assets/calm.png" alt="" draggable="false" />
      <img class="face" id="faceConfident" src="assets/confident.png" alt="" draggable="false" />
      <img class="face" id="facePlayful" src="assets/playful.png" alt="" draggable="false" />
      <img class="face" id="faceSerious" src="assets/serious.png" alt="" draggable="false" />
      <img class="face" id="faceLove" src="assets/love-happy.png" alt="" draggable="false" />
      <img class="face" id="faceRua" src="assets/rua.gif" alt="" draggable="false" />
    </div>
  </div>

<script>
  const { ipcRenderer } = require("electron");
  const CH = "plugin:cyrene-balance:";

  const $ = (id) => document.getElementById(id);
  const shell = $("shell");
  const infoBubble = $("infoBubble");
  const talkBubble = $("talkBubble");
  const talkRow = $("talkRow");
  const infoLine = $("infoLine");
  const talkLine = $("talkLine");
  const numEl = $("num");
  const metaEl = $("meta");
  const peakEl = $("peak");
  const sprite = $("sprite");
  const sticker = $("sticker");
  const baseImg = $("base");

  /* ---------- 8 张透明主立绘，按间隔轮换 ---------- */
  const POSES = [
    "assets/frame-01.png",
    "assets/frame-02.png",
    "assets/frame-03.png",
    "assets/frame-04.png",
    "assets/frame-05.png",
    "assets/frame-06.png",
    "assets/frame-07.png",
    "assets/frame-08.png",
  ];
  let poseIndex = 0;
  let poseTimer = null;

  function applyPose(index) {
    if (!baseImg || POSES.length < 2) return;
    const next = ((index % POSES.length) + POSES.length) % POSES.length;
    poseIndex = next;
    if (baseImg.getAttribute("src") !== POSES[next]) baseImg.setAttribute("src", POSES[next]);
  }

  function nextPose() {
    applyPose(poseIndex + 1);
    schedulePose();
  }

  function schedulePose() {
    if (poseTimer) {
      clearTimeout(poseTimer);
      poseTimer = null;
    }
    if (CONFIG.poseRotate === false || POSES.length < 2) return;
    const sec = Math.max(8, Number(CONFIG.poseSec) || 45);
    poseTimer = setTimeout(() => {
      applyPose(poseIndex + 1);
      schedulePose();
    }, sec * 1000);
  }

  POSES.forEach((src) => {
    const img = new Image();
    img.src = src;
  });

  const FACES = {
    calm: $("faceCalm"),
    confident: $("faceConfident"),
    playful: $("facePlayful"),
    serious: $("faceSerious"),
    love: $("faceLove"),
    rua: $("faceRua"),
  };

  /* ---------- 44 张透明表情，按情绪分组 ---------- */
  const EMOJI = {
    low: ["poorwallet.png", "Hurtcry.png", "Sobbinghard.png", "PanincCrying.png", "sotired.png"],
    normal: ["OK.png", "Thumbsup.png", "sonice.png", "sogood.png", "Allset.png", "hellyeah.png", "Free.png", "copythat.png"],
    happy: ["Gigglelots.png", "hellyeah.png", "sogood.png", "awesome.png", "sonice.png", "Allset.png"],
    shy: ["blushhard.png", "shyshort.png", "Airkiss.png", "hugtight.png", "foryou.png"],
    think: ["thinking.png", "Whatswrong.png", "midmeh.png", "hmph.png", "awkward.png"],
    tired: ["deadtired.png", "sotired.png", "sleepynow.png", "goodnight.png"],
    eat: ["eating.png", "teatime.png", "foryou.png", "putmd.png"],
    sad: ["weeploud.png", "Hurtcry.png", "giveup.png", "awkward.png"],
    angry: ["Madnow.png", "hmph.png", "fighting.png"],
    greet: ["hello.png", "HI.png", "goodmoring1.png", "Thanks.png"],
  };

  const GROUPS = [
    { face: "playful", mood: "happy", lines: ["嘻嘻，被你抓到啦♪", "今天心情很好呢", "要不要陪人家玩一会儿？"] },
    { face: "love", mood: "shy", lines: ["悄悄告诉你，人家一直在看你哦", "这颗心，是留给你的呀", "喜欢你呀，超级喜欢♪"] },
    { face: "calm", mood: "normal", lines: ["人家在呢，安安静静陪着你就好", "慢慢来，不着急", "风很轻，今天适合发一会儿呆"] },
    { face: "confident", mood: "normal", lines: ["余额人家帮你盯着呢，放心", "交给人家就好♪", "这点小事，难不倒咱"] },
    { face: "serious", mood: "think", lines: ["这个要好好算一算", "认真的时候，不许打扰哦", "嗯……让咱想一想"] },
  ];

  const LINES = {
    normal: [
      "余额 {total} 元，今天用了 {spent}，稳着呢♪",
      "人家一直帮你盯着，余额 {total} 元",
      "账户里还有 {total} 元，放心用",
      "{peak}价时段，现在用正划算♪",
      "今天花了 {spent} 元，余额 {total}，都在计划里",
      "余额 {total} 元，安安心心的♪",
      "你的小金库还好好的，{total} 元",
      "今天只用掉 {spent} 元，很克制呢",
      "余额 {total} 元，够用很久啦",
      "给你报个数：{total} 元，{peak}价中",
    ],
    low: [
      "余额只剩 {total} 元啦，记得充值哦",
      "快见底了，只剩 {total} 元……",
      "余额 {total} 元，低于提醒线啦",
      "钱包君在喊饿了，{total} 元",
      "就剩 {total} 元了，要省着点用呀",
    ],
    overBudget: [
      "今天已经用了 {spent} 元，超过预算咯",
      "预算花超啦，今天 {spent} 元",
      "今天花得有点快，{spent} 元了",
    ],
  };

  const QUESTIONS = [
    { face: "calm", mood: "greet", t: "今天想一起做点什么呢？" },
    { face: "playful", mood: "happy", t: "需要人家帮你看看余额吗？" },
    { face: "serious", mood: "think", t: "这个月的预算还够吗？" },
    { face: "calm", mood: "tired", t: "累不累？休息一下呀♪" },
    { face: "love", mood: "shy", t: "有什么想法，跟人家说说嘛" },
    { face: "playful", mood: "think", t: "都不理人家……是不是忘了我在啦？" },
  ];

  const SCALES = [0.75, 0.9, 1, 1.15, 1.3, 1.5];
  let scale = 1;
  let lastData = null;
  let shown = 0;
  let raf = null;
  let bubbleTimer = null;
  let faceTimer = null;
  let stickerTimer = null;
  let rotateTimer = null;
  let activeBubble = infoBubble;

  /* ---------- 用户配置（右键菜单可调） ---------- */
  const CONFIG = {
    stickerDuration: 3.4,
    stickerPlacement: "inside",
    stickerSize: 42,
    bubbleSize: "normal",
    bubbleMode: "rotate",
    bubblePlace: "top",
    bubbleFont: 1,
    talkFont: 12,
    rotateSec: 12,
  };

  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
  function fill(t, d) {
    return t
      .replace("{total}", Number(d.total).toFixed(2))
      .replace("{spent}", Number(d.spent).toFixed(2))
      .replace("{peak}", d.peak && d.peak.short ? d.peak.short : "谷");
  }
  function chooseLine(d) {
    if (d.overBudget) return fill(pick(LINES.overBudget), d);
    if (d.low) return fill(pick(LINES.low), d);
    return fill(pick(LINES.normal), d);
  }

  /* ---------- 字号 / 尺寸 / 位置 ---------- */
  function applySizes() {
    document.documentElement.style.setProperty("--fs", String(CONFIG.bubbleFont));
    document.documentElement.style.setProperty("--talk-fs", CONFIG.talkFont + "px");
    document.documentElement.style.setProperty("--sticker-size", CONFIG.stickerSize + "px");
    [infoBubble, talkBubble].forEach((el) => {
      el.classList.remove(
        "size-compact", "size-normal", "size-roomy", "size-xlarge",
        "place-top", "place-middle", "place-bottom",
      );
      el.classList.add("size-" + CONFIG.bubbleSize);
      el.classList.add("place-" + CONFIG.bubblePlace);
    });
    fitSprite();
  }

  /* ---------- 贴纸挂载：气泡内 / 窗口角落 ---------- */
  function mountSticker() {
    const place = CONFIG.stickerPlacement;
    const inside = place === "inside";
    const parent = inside ? talkRow : shell;
    if (sticker.parentElement !== parent) parent.appendChild(sticker);
    sticker.classList.toggle("in-bubble", inside);
    sticker.classList.remove("place-inside", "place-corner", "place-bl", "place-tl");
    sticker.classList.add("place-" + place);
    sticker.style.top = "";
    sticker.style.left = "";
    sticker.style.right = "";
    sticker.style.bottom = "";
  }

  function showSticker(mood) {
    const pool = EMOJI[mood] || EMOJI.normal;
    sticker.src = "assets/emoji/" + pick(pool);
    sticker.classList.remove("on");
    void sticker.offsetWidth;
    sticker.classList.add("on");
    mountSticker();
    if (stickerTimer) clearTimeout(stickerTimer);
    stickerTimer = setTimeout(
      () => sticker.classList.remove("on"),
      Math.round(Math.max(0.8, CONFIG.stickerDuration) * 1000),
    );
  }

  /* ---------- 表情：透明立绘叠层，到期回到默认 ---------- */
  function setFace(name, ms) {
    const img = FACES[name];
    if (!img) return;
    Object.values(FACES).forEach((f) => f.classList.remove("on"));
    img.classList.add("on");
    sprite.classList.add("showing-face");
    if (faceTimer) clearTimeout(faceTimer);
    faceTimer = setTimeout(() => {
      Object.values(FACES).forEach((f) => f.classList.remove("on"));
      sprite.classList.remove("showing-face");
    }, ms || 2400);
  }

  /* 气泡占多高，立绘就往里让多少，避免压住角色 */
  function fitSprite() {
    const shown = [infoBubble, talkBubble].find((b) => b.classList.contains("show"));
    const h = shown ? shown.offsetHeight : 0;
    const room = 250 - 8 - (4 + h + 6);
    const s = Math.max(0.56, Math.min(1, room / 180));
    document.documentElement.style.setProperty("--sprite-scale", s.toFixed(3));
  }

  /* ---------- 双气泡 ---------- */
  function showPanel(el, ms) {
    [infoBubble, talkBubble].forEach((b) => {
      if (b !== el) b.classList.remove("show", "pop");
    });
    activeBubble = el;
    el.classList.add("show");
    el.classList.remove("pop");
    void el.offsetWidth;
    el.classList.add("pop");
    if (bubbleTimer) clearTimeout(bubbleTimer);
    bubbleTimer = setTimeout(() => {
      el.classList.remove("show");
      fitSprite();
    }, ms || 5000);
    requestAnimationFrame(() => {
      mountSticker();
      fitSprite();
    });
  }

  function panelMs() {
    return Math.max(3500, Math.min(7000, Math.round(CONFIG.rotateSec * 500)));
  }

  function presentInfo(force) {
    if (!lastData || !lastData.ok) return;
    if (!force && CONFIG.bubbleMode === "talk") return;
    const text = chooseLine(lastData);
    infoLine.textContent = text;
    showPanel(infoBubble, panelMs());
  }

  function presentTalk(text, face, mood) {
    const line = text || pick(pick(GROUPS).lines);
    talkLine.textContent = line;
    if (face) setFace(face, 2600);
    showPanel(talkBubble, panelMs());
    if (mood) showSticker(mood);
  }

  function saySomething() {
    const g = pick(GROUPS);
    presentTalk(pick(g.lines), g.face, g.mood);
    playSound("assets/Ya2.mp3", 0.42);
  }

  function startRotate() {
    if (rotateTimer) clearInterval(rotateTimer);
    rotateTimer = null;
    if (CONFIG.bubbleMode !== "rotate") return;
    const gap = Math.max(5, CONFIG.rotateSec) * 1000;
    rotateTimer = setInterval(() => {
      if (CONFIG.bubbleMode !== "rotate") return;
      if (!lastData || !lastData.ok) return;
      if (activeBubble === infoBubble) saySomething();
      else presentInfo(true);
    }, gap);
  }

  /* ---------- 数字滚动 ---------- */
  function rollTo(target) {
    const from = shown;
    const to = Number(target) || 0;
    if (Math.abs(to - from) < 0.001) { shown = to; numEl.textContent = to.toFixed(2); return; }
    const start = performance.now();
    const dur = 900;
    if (raf) cancelAnimationFrame(raf);
    const step = (now) => {
      const t = Math.min(1, (now - start) / dur);
      const eased = 1 - Math.pow(1 - t, 3);
      numEl.textContent = (from + (to - from) * eased).toFixed(2);
      if (t < 1) raf = requestAnimationFrame(step);
      else { shown = to; numEl.textContent = to.toFixed(2); }
    };
    raf = requestAnimationFrame(step);
  }

  /* ---------- 渲染 ---------- */
  let wasLow = false;
  let wasOverBudget = false;
  function render(d) {
    if (!d) return;
    lastData = d;
    if (!d.ok) {
      presentTalk(d.error || "查询失败", "serious", "sad");
      return;
    }
    rollTo(d.total);

    const spent = Number(d.spent) || 0;
    const recharge = Number(d.recharge) || 0;
    let meta = "今天用掉 " + spent.toFixed(2) + " 元";
    if (recharge > 0) meta += " · 充入 " + recharge.toFixed(2);
    if (d.overBudget) meta = "已超预算 · 用掉 " + spent.toFixed(2);
    metaEl.textContent = meta;

    peakEl.textContent = d.peak && d.peak.short ? d.peak.short : "谷";
    peakEl.classList.toggle("peak", Boolean(d.peak && d.peak.peak));

    const low = Boolean(d.low);
    const over = Boolean(d.overBudget);
    const lowTurn = low && !wasLow;
    const overTurn = over && !wasOverBudget && !lowTurn;
    if (lowTurn || overTurn) {
      playSound("assets/task-end-a.wav", 0.5);
      const text = lowTurn
        ? fill(pick(LINES.low), d)
        : "今天已经用掉 " + spent.toFixed(2) + " 元，超过 " + (Number(d.budget) || 0).toFixed(2) + " 元预算啦。";
      infoLine.textContent = text;
      setFace("serious", 2600);
      showSticker("low");
      showPanel(infoBubble, panelMs());
    }
    wasLow = low;
    wasOverBudget = over;
    infoBubble.classList.toggle("low", low);

    if (activeBubble === infoBubble && infoBubble.classList.contains("show")) {
      const text = chooseLine(d);
      infoLine.textContent = text;
    }
    if (infoBubble.classList.contains("show")) fitSprite();
  }

  function applyScale(value) {
    scale = value;
    document.documentElement.style.setProperty("--scale", String(value));
  }

  /* ---------- 声音 ---------- */
  function playSound(src, vol) {
    try {
      const audio = new Audio(src);
      audio.volume = vol || 0.55;
      audio.play().catch(() => {});
    } catch (e) {}
  }

  /* ---------- 按压 Q 弹 + 拖拽 ---------- */
  let dragging = false;
  let moved = false;
  let startX = 0, startY = 0, lastX = 0, lastY = 0;
  let pendingDx = 0, pendingDy = 0, rafPending = false;

  function flushMove() {
    rafPending = false;
    if (!pendingDx && !pendingDy) return;
    const dx = pendingDx, dy = pendingDy;
    pendingDx = 0; pendingDy = 0;
    ipcRenderer.invoke(CH + "moveBy", { dx, dy }).catch(() => {});
  }

  sprite.addEventListener("pointerdown", (e) => {
    dragging = true;
    moved = false;
    startX = e.screenX; startY = e.screenY;
    lastX = e.screenX; lastY = e.screenY;
    sprite.classList.add("pressed");
    playSound("assets/Ya1.mp3", 0.5);
    try { sprite.setPointerCapture(e.pointerId); } catch (err) {}
  });

  sprite.addEventListener("pointermove", (e) => {
    if (!dragging) return;
    const dx = e.screenX - lastX;
    const dy = e.screenY - lastY;
    lastX = e.screenX; lastY = e.screenY;
    if (Math.abs(e.screenX - startX) > 4 || Math.abs(e.screenY - startY) > 4) moved = true;
    if (moved && (dx || dy)) {
      pendingDx += dx; pendingDy += dy;
      if (!rafPending) { rafPending = true; requestAnimationFrame(flushMove); }
    }
  });

  function endDrag() {
    if (!dragging) return;
    dragging = false;
    sprite.classList.remove("pressed");
    playSound("assets/Ya2.mp3", 0.5);
    if (!moved) {
      setFace("rua", 780);
      saySomething();
    }
  }
  sprite.addEventListener("pointerup", endDrag);
  sprite.addEventListener("pointercancel", () => {
    dragging = false;
    sprite.classList.remove("pressed");
  });

  sprite.addEventListener("contextmenu", (e) => {
    e.preventDefault();
    ipcRenderer.invoke(CH + "showMenu").catch(() => {});
  });

  ipcRenderer.on("menu-action", (e, type) => {
    if (type === "talk") { setFace("rua", 780); saySomething(); }
    else if (type === "next-pose") nextPose();
    else if (type === "zoom-in") changeScale(1);
    else if (type === "zoom-out") changeScale(-1);
    else if (type === "refresh") load(true);
    else if (type === "close") ipcRenderer.invoke(CH + "close").catch(() => {});
  });

  ipcRenderer.on("config-changed", () => {
    void loadConfig();
  });

  /* ---------- 配置 ---------- */
  async function loadConfig() {
    try {
      const c = await ipcRenderer.invoke(CH + "config");
      if (c) {
        if (typeof c.stickerDuration === "number") CONFIG.stickerDuration = c.stickerDuration;
        if (c.stickerPlacement) CONFIG.stickerPlacement = c.stickerPlacement;
        if (c.bubbleSize) CONFIG.bubbleSize = c.bubbleSize;
        if (c.bubbleMode) CONFIG.bubbleMode = c.bubbleMode;
        if (c.bubblePlace) CONFIG.bubblePlace = c.bubblePlace;
        if (typeof c.bubbleFont === "number") CONFIG.bubbleFont = c.bubbleFont;
        if (typeof c.talkFont === "number") CONFIG.talkFont = c.talkFont;
        if (typeof c.stickerSize === "number") CONFIG.stickerSize = c.stickerSize;
        if (typeof c.rotateSec === "number") CONFIG.rotateSec = c.rotateSec;
        if (typeof c.poseRotate === "boolean") CONFIG.poseRotate = c.poseRotate;
        if (typeof c.poseSec === "number") CONFIG.poseSec = c.poseSec;
      }
    } catch (e) {}
    applySizes();
    mountSticker();
    startRotate();
    schedulePose();
  }

  /* ---------- 数据 / 缩放 ---------- */
  async function load(refresh) {
    try {
      const data = await ipcRenderer.invoke(CH + (refresh ? "refresh" : "get"));
      render(data);
    } catch (e) {
      presentTalk("读取失败", "serious", "sad");
    }
  }
  async function changeScale(dir) {
    const idx = SCALES.indexOf(scale);
    const next = SCALES[Math.max(0, Math.min(SCALES.length - 1, (idx < 0 ? 2 : idx) + dir))];
    if (next === scale) return;
    try {
      const applied = await ipcRenderer.invoke(CH + "setScale", next);
      applyScale(typeof applied === "number" ? applied : next);
    } catch (e) {
      applyScale(next);
    }
  }

  /* ---------- 启动 ---------- */
  (async () => {
    try {
      const s = await ipcRenderer.invoke(CH + "scale");
      if (typeof s === "number" && s > 0) applyScale(s);
    } catch (e) {}
    await loadConfig();
    await load(false);
    setFace("calm", 1900);
    setTimeout(() => {
      presentInfo(true);
      showSticker("greet");
    }, 500);
  })();

  setInterval(() => load(false), 30000);

  setInterval(() => {
    if (lastData && lastData.ok && !infoBubble.classList.contains("show")) {
      const text = chooseLine(lastData);
      infoLine.textContent = text;
    }
  }, 15000);

  setInterval(() => {
    if (CONFIG.bubbleMode === "info") return;
    if (!lastData) return;
    const q = pick(QUESTIONS);
    presentTalk(q.t, q.face, q.mood);
  }, 6 * 60 * 1000);

  setTimeout(() => {
    if (lastData) {
      const q = pick(QUESTIONS);
      presentTalk(q.t, q.face, q.mood);
    }
  }, 90 * 1000);
</script>
</body>
</html>
