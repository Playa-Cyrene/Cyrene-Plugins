<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>昔涟 · 桌宠</title>
<style>
  :root {
    --scale: 1;
    --fs: 1;
    --task-fs: 12px;
    --task-list-h: 150px;
    --hud-h: 0px;
    --sprite-bottom: 8px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: "Microsoft YaHei UI", "Microsoft YaHei", system-ui, sans-serif;
    -webkit-user-select: none;
    user-select: none;
  }
  #shell {
    width: 203px;
    height: 100%;
    transform: scale(var(--scale));
    transform-origin: top left;
    position: relative;
    transition: transform 0.16s ease-out;
  }

  /* ---------- 气泡通用 ---------- */
  .bubble {
    --pad-x: 13px;
    --pad-y: 10px;
    position: absolute;
    left: 3px;
    right: 3px;
    padding: var(--pad-y) var(--pad-x) calc(var(--pad-y) + 1px);
    border-radius: 22px 18px 20px 16px;
    background: linear-gradient(165deg, #fff7fb 0%, #ffeaf4 55%, #ffdcec 100%);
    box-shadow: 0 5px 16px rgba(214, 110, 155, 0.32), inset 0 0 0 1px rgba(255,255,255,0.95);
    z-index: 20;
    transform-origin: top center;
    opacity: 0;
    transform: translateY(-8px) scale(0.85);
    pointer-events: none;
    transition: opacity 0.25s ease, transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .bubble.show {
    opacity: 1;
    transform: translateY(0) scale(1);
    pointer-events: auto;
  }
  .bubble::after {
    content: "";
    position: absolute;
    left: 42%;
    bottom: -9px;
    width: 18px;
    height: 11px;
    margin-left: -9px;
    background: radial-gradient(circle at 50% 0%, #ffdcec 0%, #ffdcec 62%, transparent 68%);
    border-radius: 50%;
  }
  .bubble.low {
    background: linear-gradient(165deg, #fff6f6 0%, #ffe4e7 55%, #ffd4d9 100%);
  }
  .bubble.low::after { background: radial-gradient(circle at 50% 0%, #ffd4d9 0%, #ffd4d9 62%, transparent 68%); }
  .bubble.over-limit {
    background: linear-gradient(165deg, #fff0f5 0%, #ffd0de 52%, #ffb1c7 100%);
    box-shadow: 0 0 0 2px rgba(255, 118, 162, 0.38), 0 8px 20px rgba(255, 118, 162, 0.3);
    animation: limitPulse 1.8s ease-in-out infinite;
  }
  .bubble.over-limit::after { background: radial-gradient(circle at 50% 0%, #ffb1c7 0%, #ffb1c7 62%, transparent 68%); }
  .over-limit .line { color: #a3254a; font-weight: 600; }
  @keyframes limitPulse {
    0%, 100% { box-shadow: 0 0 0 2px rgba(255, 118, 162, 0.38), 0 8px 20px rgba(255, 118, 162, 0.3); }
    50% { box-shadow: 0 0 0 4px rgba(255, 118, 162, 0.18), 0 10px 26px rgba(255, 118, 162, 0.42); }
  }
  .bubble.pop { animation: bubblePop 0.42s cubic-bezier(0.34, 1.56, 0.64, 1); }
  @keyframes bubblePop {
    0% { transform: translateY(-5px) scale(0.9); }
    55% { transform: translateY(0) scale(1.05); }
    100% { transform: translateY(0) scale(1); }
  }

  /* 位置档位 */
  /* 气泡贴住立绘头顶：窗口高度怎么变都不会和立绘分家 */
  .bubble.place-top {
    top: auto;
    bottom: calc(var(--sprite-bottom, 8px) + 186px);
    transform-origin: bottom center;
  }
  .bubble.place-middle { top: 46px; bottom: auto; transform-origin: top center; }
  .bubble.place-bottom { top: auto; bottom: 8px; transform-origin: bottom center; }
  .bubble.place-bottom::after { display: none; }

  /* 尺寸档位：只改留白和圆角，字号交给字号设置 */
  .bubble.size-compact { --pad-x: 8px; --pad-y: 6px; border-radius: 16px 13px 15px 12px; }
  .bubble.size-normal { --pad-x: 13px; --pad-y: 10px; }
  .bubble.size-roomy { --pad-x: 17px; --pad-y: 15px; border-radius: 26px 20px 24px 18px; }
  .bubble.size-xlarge { --pad-x: 21px; --pad-y: 20px; border-radius: 30px 24px 28px 22px; }

  .line {
    font-size: calc(11px * var(--fs));
    color: #a06780;
    line-height: 1.5;
    min-height: calc(17px * var(--fs));
    white-space: pre-wrap;
    word-break: break-word;
  }
  .low .line { color: #b04a5c; }

  .amount {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 0 3px;
    margin-top: 3px;
    color: #7a4258;
  }
  .amount .num {
    font-size: clamp(20px, calc(28px * var(--fs)), 40px);
    font-weight: 700;
    letter-spacing: -0.5px;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .amount .unit { font-size: calc(10px * var(--fs)); color: #b57e94; }

  .meta {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 4px;
    min-width: 0;
    font-size: calc(8.5px * var(--fs));
    color: #a0748a;
  }
  .meta .txt { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pill {
    font-size: calc(8px * var(--fs));
    line-height: 1.6;
    padding: 0 6px;
    border-radius: 7px;
    background: #d9f2e6;
    color: #3f8f6d;
    flex: 0 0 auto;
  }
  .pill.peak { background: #ffe0d6; color: #c25a35; }

  /* ---------- 台词气泡：只放一句话，小表情嵌在右侧 ---------- */
  .bubble.talk { padding: var(--pad-y) var(--pad-x); }
  .talk-row {
    display: flex;
    align-items: center;
    gap: 8px;
    min-height: var(--sticker-size, 42px);
  }
  .bubble.talk .line {
    flex: 1 1 auto;
    min-width: 0;
    min-height: 0;
    /* 台词字号独立，不跟着余额字号缩放 */
    font-size: var(--talk-fs, 12px);
    line-height: 1.45;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
    word-break: break-word;
  }

  /* ---------- 角标表情 ---------- */
  .sticker {
    width: var(--sticker-size, 42px);
    height: var(--sticker-size, 42px);
    object-fit: contain;
    opacity: 0;
    transform: scale(0.55) translateY(6px);
    transform-origin: center;
    transition: opacity 0.24s ease, transform 0.38s cubic-bezier(0.34, 1.56, 0.64, 1);
    pointer-events: none;
    filter: drop-shadow(0 2px 5px rgba(180, 80, 120, 0.28));
    -webkit-user-drag: none;
  }
  .sticker.on { opacity: 1; transform: scale(1) translateY(0); }
  /* 在气泡里：跟着文字一起排，不再压到立绘 */
  .sticker.in-bubble {
    position: relative;
    flex: 0 0 var(--sticker-size, 42px);
    z-index: 1;
  }
  /* 在窗口角落：独立定位 */
  .sticker:not(.in-bubble) {
    position: absolute;
    z-index: 25;
  }
  .sticker.place-corner { right: -2px; bottom: 2px; transform-origin: bottom right; }
  .sticker.place-bl { left: -2px; bottom: 2px; transform-origin: bottom left; }
  .sticker.place-tl { left: -2px; top: 2px; transform-origin: top left; }

  /* ---------- 角色：静态立绘 + 呼吸律动 ---------- */
  #sprite {
    position: absolute;
    /* 气泡变宽时窗口向左扩，立绘锚在距右 101.5px（默认 203 宽时的中心），视觉位置不动 */
    left: calc(100% - 101.5px);
    bottom: var(--sprite-bottom);
    width: 180px;
    height: 180px;
    transform: translateX(-50%) scale(var(--sprite-scale, 1));
    transform-origin: bottom center;
    cursor: grab;
    z-index: 2;
    transition: transform 0.34s cubic-bezier(0.34, 1.4, 0.64, 1);
  }
  #sprite:active { cursor: grabbing; }
  #sprite.pressed {
    transform: translateX(-50%) scale(calc(var(--sprite-scale, 1) * 0.94), calc(var(--sprite-scale, 1) * 0.8));
    transition: transform 0.07s ease;
  }
  #sprite img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    object-position: bottom center;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.22s ease;
    transform-origin: bottom center;
    filter: drop-shadow(0 5px 9px rgba(185, 88, 128, 0.3));
    -webkit-user-drag: none;
  }
  #sprite img.on { opacity: 1; }
  #sprite #base { opacity: 1; animation: breathe 4.6s ease-in-out infinite; }
  #sprite img.on:not(#base) { animation: breathe 4.6s ease-in-out infinite; }
  /* 表情上场时收起底图，避免两张立绘叠在一起 */
  #sprite.showing-face #base { opacity: 0; }
  @keyframes breathe {
    0%, 100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-2px) scale(1.015); }
  }

  /* ---------- 当前任务气泡（字号可调 / 列表可上滚 / 不压缩立绘） ---------- */
  .bubble.task {
    padding: 9px 11px 8px;
    z-index: 6;
    cursor: pointer;
    user-select: none;
    max-height: calc(100% - 10px);
    display: flex;
    flex-direction: column;
  }
  .task-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    font-size: calc(var(--task-fs) + 1px);
    flex: 0 0 auto;
  }
  .task-title { font-weight: 700; color: #8a4b63; letter-spacing: 0.04em; }
  .task-count { font-size: var(--task-fs); color: #b07088; font-variant-numeric: tabular-nums; }
  .task-bar {
    margin-top: 6px;
    height: 4px;
    border-radius: 2px;
    background: rgba(255, 160, 190, 0.28);
    overflow: hidden;
    flex: 0 0 auto;
  }
  .task-bar i {
    display: block;
    height: 100%;
    width: 0%;
    border-radius: 2px;
    background: linear-gradient(90deg, #ff9fc0, #ff6f9f);
    transition: width 0.35s ease;
  }
  .task-now {
    margin-top: 6px;
    font-size: var(--task-fs);
    line-height: 1.5;
    color: #7a4a5e;
    word-break: break-word;
    flex: 0 0 auto;
  }
  .task-now.done { color: #4f8f74; }
  .task-list {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.28s ease;
  }
  .bubble.task.expanded .task-list {
    max-height: var(--task-list-h);
    overflow-y: auto;
    overscroll-behavior: contain;
    scrollbar-width: thin;
    scrollbar-color: rgba(255, 143, 183, 0.6) transparent;
    margin-top: 6px;
    padding-right: 2px;
    flex: 1 1 auto;
    min-height: 0;
  }
  .task-list::-webkit-scrollbar { width: 5px; }
  .task-list::-webkit-scrollbar-thumb {
    background: rgba(255, 143, 183, 0.62);
    border-radius: 99px;
  }
  .task-list::-webkit-scrollbar-track { background: transparent; }
  .task-item {
    display: flex;
    gap: 5px;
    font-size: var(--task-fs);
    line-height: 1.55;
    color: #8b5b6e;
    padding: 2px 0;
  }
  .task-item .dot {
    flex: 0 0 auto;
    width: 5px;
    height: 5px;
    margin-top: calc(var(--task-fs) * 0.52);
    border-radius: 50%;
    background: #e7b4c6;
  }
  .task-item.in_progress .dot {
    background: #ff6f9f;
    box-shadow: 0 0 0 3px rgba(255, 111, 159, 0.18);
  }
  .task-item.in_progress { color: #b23a69; font-weight: 600; }
  .task-item.completed { color: #9aa8a0; text-decoration: line-through; }
  .task-item.completed .dot { background: #9fd0b6; }
  .task-item.cancelled { opacity: 0.5; }
  .task-foot {
    margin-top: 4px;
    font-size: calc(var(--task-fs) - 2px);
    color: #b58aa0;
    text-align: right;
    flex: 0 0 auto;
  }

  /* ---------- 状态面板：头像 + CPU / GPU / 内存 圆环 + 网速 ---------- */
  #hud {
    position: absolute;
    left: 3px;
    right: 3px;
    bottom: 5px;
    display: none;
    z-index: 4;
    padding: 7px 9px 8px;
    border-radius: 16px 13px 17px 12px;
    background:
      radial-gradient(120% 80% at 50% 0%, rgba(255, 255, 255, 0.97), rgba(255, 245, 250, 0.9) 55%, rgba(255, 226, 240, 0.93) 100%);
    box-shadow: 0 4px 16px rgba(214, 110, 155, 0.3), inset 0 0 0 1px rgba(255, 255, 255, 0.95);
    color: #8a5468;
    cursor: pointer;
    -webkit-user-select: none;
    user-select: none;
  }
  #hud.show { display: block; }

  .hud-head { display: flex; align-items: center; gap: 6px; }
  .hud-avatar {
    flex: 0 0 auto;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    overflow: hidden;
    background: linear-gradient(160deg, #ffd9ea, #ffb9d6);
    box-shadow: 0 0 0 1.5px #fff, 0 2px 6px rgba(214, 110, 155, 0.35);
  }
  .hud-avatar img { width: 100%; height: 100%; object-fit: cover; object-position: top center; display: block; }
  .hud-name { display: none; flex: 0 0 auto; width: 30px; color: #a06780; }
  .hud-id { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; line-height: 1.18; }
  .hud-mood { font-size: calc(10px * var(--fs)); font-weight: 700; color: #b23a69; white-space: nowrap; }
  .hud-model {
    font-size: calc(8px * var(--fs));
    color: #ab7c90;
    font-style: normal;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .hud-peek-val {
    flex: 0 0 auto;
    font-size: calc(8.5px * var(--fs));
    color: #b07088;
    font-variant-numeric: tabular-nums;
  }

  .hud-detail { margin-top: 6px; }
  #hud:not(.expanded) .hud-detail { display: none; }
  #hud.expanded .hud-peek-val { display: none; }

  .hud-rings { display: flex; justify-content: space-between; gap: 4px; }
  .ring {
    flex: 1 1 0;
    min-width: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1px;
    position: relative;
  }
  .ring svg { width: 40px; height: 40px; transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 4; stroke-linecap: round; }
  .ring .track { stroke: rgba(255, 160, 190, 0.32); }
  .ring .fill { stroke: #ff7faf; transition: stroke-dashoffset 0.5s ease; }
  .ring .fill.gpu { stroke: #b58bff; }
  .ring .fill.mem { stroke: #ffa26f; }
  .ring-pct {
    position: absolute;
    top: 12px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: calc(9px * var(--fs));
    font-weight: 700;
    color: #8a5468;
    font-variant-numeric: tabular-nums;
  }
  .ring-tag { font-size: calc(7.5px * var(--fs)); color: #ab7c90; letter-spacing: 0.02em; }

  .hud-net {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 4px;
    margin-top: 4px;
    padding-top: 4px;
    border-top: 1px dashed rgba(226, 138, 178, 0.36);
    font-size: calc(8.5px * var(--fs));
    color: #a06780;
    font-variant-numeric: tabular-nums;
  }
  .hud-net .net-item { display: flex; align-items: center; gap: 3px; white-space: nowrap; }
  .hud-net .dl { color: #ff6f9f; font-style: normal; }
  .hud-net .ul { color: #b58bff; font-style: normal; }
  .hud-net .bat { color: #7fa9c9; }

  /* 简版：回到原来那一行——状态 / CPU·内存 / 心情 */
  #hud.simple { padding: 6px 9px 7px; }
  #hud.simple .hud-detail,
  #hud.simple .hud-avatar,
  #hud.simple .hud-model { display: none; }
  #hud.simple .hud-head { gap: 5px; font-size: calc(9px * var(--fs)); }
  #hud.simple .hud-name { display: inline; }
  #hud.simple .hud-peek-val {
    display: inline;
    flex: 1 1 auto;
    min-width: 34px;
    text-align: right;
    font-size: calc(9px * var(--fs));
    color: #b07088;
  }
  #hud.simple .hud-id { flex: 0 0 auto; flex-direction: row; align-items: center; }
  #hud.simple .hud-mood { font-size: calc(9px * var(--fs)); font-weight: 600; }

  /* 简版2：头像 + 心情/模型 + CPU·内存，圆环那一段收起 */
  #hud.simple2 { padding: 7px 9px 8px; }
  #hud.simple2 .hud-detail,
  #hud.simple2 .hud-name { display: none; }
  #hud.simple2 .hud-head { gap: 6px; }
  #hud.simple2 .hud-id { order: 2; }
  /* 收起来时只看头像和心情，点开才露出 CPU · 内存 */
  #hud.simple2 .hud-peek-val {
    display: none;
    order: 3;
  }
  #hud.simple2.expanded .hud-peek-val {
    display: inline;
  }

  /* ---------- 卡片层：提问 / 审批 ---------- */
  #cardFrame {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    background: transparent;
    display: none;
    z-index: 60;
  }
  /* 只占底部一条，绝不整窗铺满——铺满会把卡片的点击和滚轮一起吃掉 */
  #cardFallback {
    position: fixed;
    left: 10px;
    right: 10px;
    bottom: 10px;
    z-index: 70;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 10px 12px;
    text-align: center;
    color: #6b4a5a;
    background: rgba(255, 247, 250, 0.97);
    border-radius: 14px;
    box-shadow: 0 8px 22px rgba(206, 96, 146, 0.26);
    font-size: 12px;
  }
  #cardFallback.show { display: flex; }
  #cardFallback p { margin: 0; }
  #cardFallbackBtn {
    border: 0;
    border-radius: 999px;
    padding: 8px 18px;
    background: #ffb3cd;
    color: #5a2a3d;
    font-size: 13px;
    cursor: pointer;
  }
  body.card-mode #shell { display: none; }
</style>
</head>
<body>
  <div id="shell">
    <div class="bubble info place-top" id="infoBubble">
      <div class="line" id="infoLine">…</div>
      <div class="amount">
        <span class="num" id="num">0.00</span>
        <span class="unit">元</span>
        <span class="meta">
          <span class="txt" id="meta">--</span>
          <span class="pill" id="peak">谷</span>
        </span>
      </div>
    </div>

    <div class="bubble talk place-top" id="talkBubble">
      <div class="talk-row" id="talkRow">
        <div class="line" id="talkLine">…</div>
        <img class="sticker in-bubble" id="sticker" alt="" />
      </div>
    </div>

    <div class="bubble task place-top" id="taskBubble">
      <div class="task-head">
        <span class="task-title">当前任务</span>
        <span class="task-count" id="taskCount">0/0</span>
      </div>
      <div class="task-bar"><i id="taskBar"></i></div>
      <div class="task-now" id="taskNow">还没有开始呢</div>
      <div class="task-list" id="taskList"></div>
      <div class="task-foot">点一下展开 · 长按立绘也能展开</div>
    </div>

    <div id="hud" title="点一下展开状态">
      <div class="hud-head">
        <span class="hud-avatar"><img src="assets/calm.png" alt="" draggable="false" /></span>
        <span class="hud-name" id="hudName">状态</span>
        <span class="hud-peek-val" id="hudPeek">--</span>
        <span class="hud-id">
          <b class="hud-mood" id="hudMood">平静</b>
          <em class="hud-model" id="hudModel">--</em>
        </span>
      </div>
      <div class="hud-detail">
        <div class="hud-rings">
          <div class="ring">
            <svg viewBox="0 0 40 40"><circle class="track" cx="20" cy="20" r="16" /><circle class="fill cpu" id="hudCpuRing" cx="20" cy="20" r="16" /></svg>
            <span class="ring-pct" id="hudCpu">--</span>
            <span class="ring-tag">CPU</span>
          </div>
          <div class="ring">
            <svg viewBox="0 0 40 40"><circle class="track" cx="20" cy="20" r="16" /><circle class="fill gpu" id="hudGpuRing" cx="20" cy="20" r="16" /></svg>
            <span class="ring-pct" id="hudGpu">--</span>
            <span class="ring-tag">GPU</span>
          </div>
          <div class="ring">
            <svg viewBox="0 0 40 40"><circle class="track" cx="20" cy="20" r="16" /><circle class="fill mem" id="hudMemRing" cx="20" cy="20" r="16" /></svg>
            <span class="ring-pct" id="hudMem">--</span>
            <span class="ring-tag">内存</span>
          </div>
        </div>
        <div class="hud-net">
          <span class="net-item"><i class="dl">↓</i><b id="hudDown">--</b></span>
          <span class="net-item"><i class="ul">↑</i><b id="hudUp">--</b></span>
          <span class="net-item bat"><i>●</i><b id="hudBat">--</b></span>
        </div>
      </div>
    </div>

    <div id="sprite">
      <img id="base" src="assets/frame-01.png" alt="昔涟" draggable="false" />

  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
  function fill(t, d) {
    const spent = Number(d.spent) || 0;
    const limit = Number(d.budget) || 0;
    return t
      .replace("{total}", Number(d.total).toFixed(2))
      .replace("{spent}", spent.toFixed(2))
      .replace("{limit}", limit > 0 ? limit.toFixed(2) : "—")
      .replace("{remain}", limit > 0 ? Math.max(0, limit - spent).toFixed(2) : "—")
      .replace("{ratio}", limit > 0 ? String(Math.round((spent / limit) * 100)) : "—")
      .replace("{peak}", d.peak && d.peak.short ? d.peak.short : "谷");
  }
  function chooseLine(d) {
    if (CONFIG.bubbleMode === "today") return fill(pick(LINES.today), d);
    if (CONFIG.bubbleMode === "balance") return fill(pick(LINES.balanceOnly), d);

    if (d.low) return fill(pick(LINES.low), d);
    return fill(pick(LINES.normal), d);
  }

  /* ---------- 字号 / 尺寸 / 位置 ---------- */

    const bubbleW = Math.max(0, Math.min(1400, Number(CONFIG.bubbleWidth) || 0));
    const bubbleH = Math.max(0, Math.min(1400, Number(CONFIG.bubbleHeight) || 0));

    [infoBubble, talkBubble, taskBubble].forEach((el) => {
      el.classList.remove(
        "size-compact", "size-normal", "size-roomy", "size-xlarge",
        "place-top", "place-middle", "place-bottom",
      );
      el.classList.add("size-" + CONFIG.bubbleSize);
      el.classList.add("place-" + CONFIG.bubblePlace);
      // 宽度：填了具体像素就固定，0 表示跟着内容走
      el.style.width = bubbleW > 0 ? bubbleW + "px" : "";
      el.style.right = bubbleW > 0 ? "auto" : "";
      // 高度：只给最小高度，内容更长时继续往下长
      el.style.minHeight = bubbleH > 0 ? bubbleH + "px" : "";
    });

    // 气泡要更宽时，窗口一起向左长，不然会被裁掉
    const cssWidth = Math.max(203, bubbleW > 0 ? bubbleW + 6 : 203);
    if (Math.abs(cssWidth - lastBubbleWindowWidth) >= 2) {
      lastBubbleWindowWidth = cssWidth;
      ipcRenderer.invoke(CH + "set-widget-width", cssWidth).catch(() => {});
    }

    applyHud();
    fitSprite();
  }

  /* ---------- 贴纸挂载：气泡内 / 窗口角落 ---------- */
  function mountSticker() {
    const place = CONFIG.stickerPlacement;
    const inside = place === "inside";
    const parent = inside ? talkRow : shell;
    if (sticker.parentElement !== parent) parent.appendChild(sticker);
    sticker.classList.toggle("in-bubble", inside);
    sticker.classList.remove("place-inside", "place-corner", "place-bl", "place-tl");
    sticker.classList.add("place-" + place);
    sticker.style.top = "";
    sticker.style.left = "";
    sticker.style.right = "";
    sticker.style.bottom = "";
  }

  function showSticker(mood) {
    const pool = EMOJI[mood] || EMOJI.normal;
    sticker.src = "assets/emoji/" + pick(pool);
    sticker.classList.remove("on");
    void sticker.offsetWidth;
    sticker.classList.add("on");
    mountSticker();
    if (stickerTimer) clearTimeout(stickerTimer);
    stickerTimer = setTimeout(
      () => sticker.classList.remove("on"),
      Math.round(Math.max(0.8, CONFIG.stickerDuration) * 1000),
    );
  }

  /* 气泡占多高，窗口就向上长多高，立绘保持原尺寸不被压扁 */
  let heightTimer = null;

  function hudHeight() {
    if (!CONFIG.hudEnabled || !hud) return 0;
    return Math.max(24, hud.offsetHeight || 24) + 8;
  }

  function fitSprite() {
    const bottom = CONFIG.hudEnabled ? hudHeight() : 8;
    document.documentElement.style.setProperty("--sprite-bottom", bottom + "px");
    document.documentElement.style.setProperty("--hud-h", CONFIG.hudEnabled ? hudHeight() + "px" : "0px");
    if (heightTimer) clearTimeout(heightTimer);
    heightTimer = setTimeout(() => {
      heightTimer = null;
      const shown = [taskBubble, infoBubble, talkBubble].find((b) => b.classList.contains("show"));
      const bubbleH = shown ? shown.offsetHeight + 8 : 0;
      const h = Math.max(250, Math.min(760, Math.round(4 + bubbleH + 6 + 180 + bottom + 6)));
      if (Math.abs(h - lastHeight) < 6) return;
      lastHeight = h;
      ipcRenderer.invoke(CH + "set-widget-height", h).catch(() => {});
    }, 80);
  }

  function applyHud() {
    if (!hud) return;
    hud.classList.toggle("show", Boolean(CONFIG.hudEnabled));
    hud.classList.toggle("simple", CONFIG.hudDetail === "simple");
    hud.classList.toggle("simple2", CONFIG.hudDetail === "simple2");
    // 简版2 默认收着，只留头像和心情；其它档位默认摊开
    if (CONFIG.hudDetail === "simple2") hud.classList.toggle("expanded", simple2Expanded);
    else hud.classList.add("expanded");
    if (CONFIG.hudEnabled && lastHud) renderHud(lastHud);
    fitSprite();
  }

  const RING_LEN = 100.53; // r=16 的周长

  function setRing(el, percent) {
    if (!el) return;
    const value = Math.max(0, Math.min(100, Number(percent) || 0));
    el.style.strokeDasharray = RING_LEN + " " + RING_LEN;
    el.style.strokeDashoffset = String(RING_LEN * (1 - value / 100));
  }

  function formatSpeed(bytes) {
    const value = Number(bytes);
    if (!Number.isFinite(value) || value < 0) return "--";
    if (value < 1024) return Math.round(value) + " B/s";
    if (value < 1048576) return Math.round(value / 1024) + " K/s";
    return (value / 1048576).toFixed(1) + " M/s";
  }

  function renderHud(data) {
    if (!data || !hud) return;
    lastHud = data;
    const cpu = Math.max(0, Math.min(100, Number(data.cpu) || 0));
    const mem = Math.max(0, Math.min(100, Number(data.memPercent) || 0));
    const hasGpu = data.gpu !== null && data.gpu !== undefined && Number.isFinite(Number(data.gpu));
    const gpu = hasGpu ? Math.max(0, Math.min(100, Number(data.gpu))) : 0;

    hudCpu.textContent = Math.round(cpu) + "%";
    hudGpu.textContent = hasGpu ? Math.round(gpu) + "%" : "--";
    hudMem.textContent = Math.round(mem) + "%";
    setRing(hudCpuRing, cpu);
    setRing(hudGpuRing, gpu);
    setRing(hudMemRing, mem);
    hudMem.title = data.memText || "";

    hudPeek.textContent = "CPU " + Math.round(cpu) + "% · 内存 " + Math.round(mem) + "%";
    hudMood.textContent = data.mood && data.mood.label ? data.mood.label : "平静";
    hudModel.textContent = data.model || "--";
    hudModel.title = data.modelDetail || data.model || "";

    hudDown.textContent = formatSpeed(data.netDown);
    hudUp.textContent = formatSpeed(data.netUp);
    hudBat.textContent =
      data.battery === null || data.battery === undefined
        ? "--"
        : (data.charging ? "充电 " : "") + Math.round(Number(data.battery)) + "%";
  }

  function refreshHud() {
    ipcRenderer
      .invoke(CH + "hud")
      .then((data) => {
        if (data) renderHud(data);
      })
      .catch(() => {});

  if (hud) {
    // 详细和简版默认摊开；简版2 收着，点一下才把 CPU · 内存 叫出来
    hud.classList.add("expanded");
    hud.addEventListener("click", (event) => {
      event.stopPropagation();
      if (CONFIG.hudDetail === "simple2") {
        simple2Expanded = !simple2Expanded;
        hud.classList.toggle("expanded", simple2Expanded);
      } else {
        hud.classList.toggle("expanded");
      }
      fitSprite();
    });
  }

  /* ---------- 三气泡互斥 ---------- */
  function showPanel(el, ms) {
    [infoBubble, talkBubble, taskBubble].forEach((b) => {
      if (b !== el) b.classList.remove("show", "pop");
    });
    activeBubble = el;
    el.classList.add("show");
    el.classList.remove("pop");
    void el.offsetWidth;
    el.classList.add("pop");
    if (bubbleTimer) clearTimeout(bubbleTimer);
    bubbleTimer = setTimeout(() => {
      el.classList.remove("show");
      fitSprite();
    }, ms || 5000);
    requestAnimationFrame(() => {
      mountSticker();
      fitSprite();
    });
  }

  function panelMs() {
    return Math.max(3500, Math.min(7000, Math.round(CONFIG.rotateSec * 500)));
  }

  function presentInfo(force) {
    if (!lastData || !lastData.ok) return;
    if (!force && CONFIG.bubbleMode === "talk") return;
    const text = chooseLine(lastData);
    infoLine.textContent = text;
    showPanel(infoBubble, panelMs());
  }

  function presentTalk(text, face, mood) {
    const line = text || pick(pick(GROUPS).lines);
    talkLine.textContent = line;
    if (face) setFace(face, 2600);
    showPanel(talkBubble, panelMs());
    if (mood) showSticker(mood);
  }

  function saySomething() {
    // 任务气泡正在展示时先让位，别把进度压掉
    if (taskBubble.classList.contains("show") && taskItems.length) return;
    const g = pick(GROUPS);
    presentTalk(pick(g.lines), g.face, g.mood);
    playSound("assets/Ya2.mp3", 0.42);
  }

  /* ---------- 当前任务气泡 ---------- */
  function scrollTaskToActive() {
    requestAnimationFrame(() => {
      if (!taskList) return;
      const active = taskList.querySelector(".task-item.in_progress") || taskList.querySelector(".task-item");
      if (active && typeof active.scrollIntoView === "function") {
        active.scrollIntoView({ block: "nearest", behavior: "smooth" });
      } else {
        taskList.scrollTop = taskList.scrollHeight;
      }
    });
  }

  function renderTask(state) {
    const items = state && Array.isArray(state.items) ? state.items : [];
    const previousDone = taskItems.filter((item) => item.status === "completed").length;
    const previousTotal = taskItems.length;

    taskItems = items;
    taskWorking = Boolean(state && state.working);
    petFlags = state && state.flags && typeof state.flags === "object" ? state.flags : petFlags;
    if (petFlags.showTaskBubble === false) {
      taskBubble.classList.remove("show");
      fitSprite();
      return;
    }

    const total = items.length;
    const done = items.filter((item) => item.status === "completed").length;
    const ended = items.filter((item) => item.status === "cancelled").length;
    const active = items.find((item) => item.status === "in_progress");

    taskCount.textContent = total ? done + "/" + total : "0/0";
    taskBar.style.width = total ? Math.round(((done + ended) / total) * 100) + "%" : "0%";

    if (!total) {
      taskNow.textContent = taskWorking ? "正在想接下来做什么…" : "还没有开始呢";
      taskNow.classList.remove("done");
    } else if (done + ended >= total) {
      taskNow.textContent = "都做完啦，要不要歇一会儿？";
      taskNow.classList.add("done");
    } else if (active) {
      taskNow.textContent = active.content;
      taskNow.classList.remove("done");
    } else {
      const next = items.find((item) => item.status === "pending");
      taskNow.textContent = next ? "接下来：" + next.content : "准备中…";
      taskNow.classList.remove("done");
    }

    taskList.innerHTML = "";
    for (const item of items) {
      const row = document.createElement("div");
      row.className = "task-item " + (item.status || "pending");
      const dot = document.createElement("span");
      dot.className = "dot";
      const text = document.createElement("span");
      text.textContent = item.content || "";
      row.appendChild(dot);
      row.appendChild(text);
      taskList.appendChild(row);
    }

    showPanel(taskBubble, Math.max(9000, panelMs()));
    requestAnimationFrame(() => {
      if (taskExpanded) scrollTaskToActive();
      fitSprite();
    });

    // 全部完成时给个小庆祝，只在“刚好做完”那一次触发
    if (total > 0 && done + ended >= total && (previousDone + previousTotal > 0) && previousDone < total) {
      setFace("love", 3600);
      showSticker("happy");
      playSound("assets/task-end-a.wav", 0.42);
    }
  }

  /* 卡片（提问 / 选择 / 审批）走 iframe。主进程只把 payload 发到本页，
     iframe 是独立文档，必须由这里再转发一次，否则里面只会显示空白题干。 */
  let pendingCardPayload = null;
  const cardFallback = $("cardFallback");
  const cardFallbackBtn = $("cardFallbackBtn");
  let cardReadyTimer = null;
  // 同一张卡可能收到多次 show；已经渲染过就别再起兜底定时器
  let cardReadyThisCard = false;
  let lastCardKeySeen = "";

  function cardLog(text) {
    ipcRenderer.invoke("plugin:cyrene-balance:card-log", String(text)).catch(() => {});
  }

  function hideCardFallback() {
    if (cardFallback) cardFallback.classList.remove("show");
  }

  // 三秒还没等到 iframe 回话，就把"回主界面回答"露出来，至少有条活路
  function armCardFallback() {
    hideCardFallback();
    if (cardReadyTimer) {
      clearTimeout(cardReadyTimer);
      cardReadyTimer = null;
    }
    // 这张卡已经渲染过就别再起定时器，否则遮罩会在几秒后自己冒出来挡住点击
    if (cardReadyThisCard) return;
    cardReadyTimer = setTimeout(() => {
      cardReadyTimer = null;
      if (cardFallback) cardFallback.classList.add("show");
      cardLog("卡片三秒未就绪，已显示兜底入口");
    }, 3000);
  }

  if (cardFallbackBtn) {
    cardFallbackBtn.addEventListener("click", () => {
      ipcRenderer.invoke("plugin:cyrene-balance:card-open-main").catch(() => {});
    });
  }

  function forwardCardPayload() {
    if (!pendingCardPayload) return;
    try {
      const target = cardFrame.contentWindow;
      if (!target) return;
      target.postMessage({ type: "balance-card", payload: pendingCardPayload }, "*");
      cardLog("卡片已转发进 iframe");
    } catch (e) {
      cardLog("转发失败 " + ((e && e.message) || e));
    }
  }

  function setCardMode(on, payload) {
    if (payload) pendingCardPayload = payload;
    document.body.classList.toggle("card-mode", on);
    if (on) {
      const key = payload && payload.card ? String(payload.card.interactionId || payload.card.id || "") : "";
      if (key && key !== lastCardKeySeen) {
        lastCardKeySeen = key;
        cardReadyThisCard = false;
      }
      if (!cardFrame.getAttribute("src")) cardFrame.setAttribute("src", "card.html");
      cardFrame.style.display = "block";
      armCardFallback();
      forwardCardPayload();
    } else {
      pendingCardPayload = null;
      cardFrame.style.display = "none";
      if (cardReadyTimer) {
        clearTimeout(cardReadyTimer);
        cardReadyTimer = null;
      }
      hideCardFallback();
      fitSprite();
    }
  }

  cardFrame.addEventListener("load", forwardCardPayload);

  // iframe 拿不到 Node 时由本页代它调主进程；只放行插件自己的通道和白名单
  window.addEventListener("message", (event) => {
    const data = event.data;
    if (!data) return;

    if (data.type === "card-ready") {
      cardReadyThisCard = true;
      if (cardReadyTimer) {
        clearTimeout(cardReadyTimer);
        cardReadyTimer = null;
      }
      hideCardFallback();
      cardLog("卡片已渲染（iframe 回话）");
      return;
    }

    if (data.type === "cyrene-card-error") {
      cardLog("卡片脚本错误 " + (data.message || "") + " @" + (data.line || "?"));
      if (cardReadyTimer) {
        clearTimeout(cardReadyTimer);
        cardReadyTimer = null;
      }
      if (cardFallback) cardFallback.classList.add("show");
      return;
    }

    if (data.type !== "cyrene-ipc-invoke" || !data.id) return;
    const channel = String(data.channel || "");
    const allowed =
      channel.indexOf("plugin:cyrene-balance:") === 0 ||
      channel === "choice:resolve" ||
      channel === "permission:approval-resolve";
    const reply = (ok, result, error) => {
      try {
        const target = event.source || cardFrame.contentWindow;
        if (target) target.postMessage({ type: "cyrene-ipc-result", id: data.id, ok, result, error }, "*");
      } catch {
        /* 忽略 */
      }
    };
    if (!allowed) {
      reply(false, null, "E_CHANNEL_DENIED");
      return;
    }
    ipcRenderer.invoke(channel, data.payload).then(
      (result) => reply(true, result),
      (error) => reply(false, null, (error && error.message) || String(error)),
    );
  });

  function openTaskPanel() {
    ipcRenderer.invoke(CH + "task-open-main").catch(() => {});
  }

  let taskPressTimer = null;
  let taskLongPressed = false;

  taskBubble.addEventListener("pointerdown", () => {
    taskLongPressed = false;
    if (taskPressTimer) clearTimeout(taskPressTimer);
    taskPressTimer = setTimeout(() => {
      taskPressTimer = null;
      taskLongPressed = true;
      openTaskPanel();
    }, 620);
  });

  ["pointerup", "pointerleave", "pointercancel"].forEach((name) => {
    taskBubble.addEventListener(name, () => {
      if (taskPressTimer) {
        clearTimeout(taskPressTimer);
        taskPressTimer = null;
      }
    });
  });

  taskBubble.addEventListener("click", (event) => {
    event.stopPropagation();
    if (taskLongPressed) {
      taskLongPressed = false;
      return;
    }
    if (!taskItems.length) return;
    taskExpanded = !taskExpanded;
    taskBubble.classList.toggle("expanded", taskExpanded);
    fitSprite();
  });

  taskBubble.addEventListener("dblclick", (event) => {
    event.stopPropagation();
    openTaskPanel();
  });

  ipcRenderer.on("balance-todo", (_event, state) => renderTask(state));
  ipcRenderer.on("balance-card:show", (_event, payload) => setCardMode(true, payload || null));
  ipcRenderer.on("balance-card:hide", () => setCardMode(false));
  ipcRenderer.on("balance-pet-hud", (_event, data) => renderHud(data));

  function startRotate() {
    if (rotateTimer) clearInterval(rotateTimer);
    rotateTimer = null;
    if (CONFIG.bubbleMode !== "rotate") return;
    const gap = Math.max(5, CONFIG.rotateSec) * 1000;
    rotateTimer = setInterval(() => {
      if (CONFIG.bubbleMode !== "rotate") return;
      if (!lastData || !lastData.ok) return;
      rotateTick += 1;
      if (rotateTick % 4 === 0) {
        const greet = hourLine();
        presentTalk(greet.t, greet.face, greet.mood);
      } else if (activeBubble === infoBubble) saySomething();
      else if (activeBubble === taskBubble) return;
      else presentInfo(true);
    }, gap);
  }

  /* ---------- 数字滚动 ---------- */
  function rollTo(target) {
    const from = shown;
    const to = Number(target) || 0;
    if (Math.abs(to - from) < 0.001) { shown = to; numEl.textContent = to.toFixed(2); return; }
    const start = performance.now();
    const dur = 900;
    if (raf) cancelAnimationFrame(raf);
    const step = (now) => {
      const t = Math.min(1, (now - start) / dur);
      const eased = 1 - Math.pow(1 - t, 3);
      numEl.textContent = (from + (to - from) * eased).toFixed(2);
      if (t < 1) raf = requestAnimationFrame(step);
      else { shown = to; numEl.textContent = to.toFixed(2); }
    };
    raf = requestAnimationFrame(step);
  }

  /* ---------- 渲染 ---------- */
  let wasLow = false;
  let wasOverBudget = false;
  function render(d) {
    if (!d) return;
    lastData = d;
    if (!d.ok) {
      presentTalk(d.error || "查询失败", "serious", "sad");
      return;
    }
    const mode = CONFIG.bubbleMode;
    const spent = Number(d.spent) || 0;
    const limit = Number(d.budget) || 0;
    const recharge = Number(d.recharge) || 0;
    const remain = limit > 0 ? Math.max(0, limit - spent) : 0;

    rollTo(mode === "today" ? spent : d.total);

    let meta;
    if (mode === "today") {
      meta = limit > 0 ? "额度 " + limit.toFixed(2) + " · 还剩 " + remain.toFixed(2) : "今日额度还没设置";
    } else if (mode === "balance") {
      meta = "今日用掉 " + spent.toFixed(2) + " 元";
    } else {
      meta = "今天用掉 " + spent.toFixed(2) + " 元";
      if (recharge > 0) meta += " · 充入 " + recharge.toFixed(2);
      if (d.overBudget) meta = "已超额度 · 用掉 " + spent.toFixed(2);
      else if (limit > 0) meta = "今天 " + spent.toFixed(2) + " / " + limit.toFixed(2);
    }
    metaEl.textContent = meta;

    peakEl.textContent = d.peak && d.peak.short ? d.peak.short : "谷";
    peakEl.classList.toggle("peak", Boolean(d.peak && d.peak.peak));

    const low = Boolean(d.low);
    const over = Boolean(d.overBudget);
    const lowTurn = low && !wasLow;
    const overTurn = over && !wasOverBudget && !lowTurn;
    if (lowTurn || overTurn) {
      if (overTurn) {
        playSound("assets/task-end-a.wav", 0.62);
        setTimeout(() => playSound("assets/Ya2.mp3", 0.5), 320);
      } else {
        playSound("assets/task-end-a.wav", 0.5);
      }
      const text = lowTurn ? fill(pick(LINES.low), d) : fill(pick(LINES.overLimit), d);
      infoLine.textContent = text;
      setFace("serious", 3200);
      showSticker("low");
      showPanel(infoBubble, overTurn ? Math.max(6000, panelMs()) : panelMs());
    }
    wasLow = low;
    wasOverBudget = over;

    const totalNow = Number(d.total) || 0;
    if (prevTotal !== null && Date.now() - lastCostTalkAt > 90000) {
      const delta = totalNow - prevTotal;
      if (delta <= -0.01) {
        lastCostTalkAt = Date.now();
        presentTalk("刚刚用掉 " + Math.abs(delta).toFixed(2) + " 元，人家记在小本本上了", "serious", "think");
      } else if (delta >= 0.01) {
        lastCostTalkAt = Date.now();
        presentTalk("充进来 " + delta.toFixed(2) + " 元啦，先替你存着♪", "love", "happy");
      }
    }
    prevTotal = totalNow;

    const peakNow = d.peak && d.peak.short ? d.peak.short : "";
    if (prevPeak && peakNow && prevPeak !== peakNow) {
      presentTalk(peakNow === "峰" ? "进入峰价时段了，用之前先想一想哦" : "谷价时段到啦，现在用最划算♪", "calm", "normal");
    }
    prevPeak = peakNow;
    infoBubble.classList.toggle("low", low);
    infoBubble.classList.toggle("over-limit", over);

    if (activeBubble === infoBubble && infoBubble.classList.contains("show")) {
      const text = chooseLine(d);
      infoLine.textContent = text;
    }
    if (infoBubble.classList.contains("show")) fitSprite();
  }

  function applyScale(value) {
    scale = value;
    document.documentElement.style.setProperty("--scale", String(value));
  }

  /* ---------- 声音 ---------- */
  function playSound(src, vol) {
    try {
      const audio = new Audio(src);
      audio.volume = vol || 0.55;
      audio.play().catch(() => {});
    } catch (e) {}
  }

  /* ---------- 按压 Q 弹 / 拖拽 / 单击·长按·双击·三击 ---------- */
  let dragging = false;
  let moved = false;
  let startX = 0, startY = 0, lastX = 0, lastY = 0;
  let pendingDx = 0, pendingDy = 0, rafPending = false;
  let pressTimer = null;
  let longPressed = false;
  let tapCount = 0;
  let tapTimer = null;

  function flushMove() {
    rafPending = false;
    if (!pendingDx && !pendingDy) return;
    const dx = pendingDx, dy = pendingDy;
    pendingDx = 0; pendingDy = 0;
    ipcRenderer.invoke(CH + "moveBy", { dx, dy }).catch(() => {});
  }

  function expandTasks() {
    if (!taskItems.length) {
      presentTalk("这会儿还没有任务，人家先陪你待着", "calm", "normal");
      return;
    }
    if (taskExpanded) {
      taskExpanded = false;
      taskBubble.classList.remove("expanded");
      fitSprite();
      return;
    }
    taskExpanded = true;
    taskBubble.classList.add("expanded");
    showPanel(taskBubble, 22000);
    scrollTaskToActive();
    fitSprite();
  }

  function showBalance() {
    if (!lastData || !lastData.ok) {
      load(true);
      return;
    }
    infoLine.textContent = chooseLine(lastData);
    showPanel(infoBubble, Math.max(6000, panelMs()));
    showSticker(lastData.low ? "low" : "normal");
  }

  function refreshAll() {
    void loadConfig();
    void load(true);
    refreshHud();
    presentTalk("刷新好啦♪ 都是最新的", "confident", "normal");
    showSticker("normal");
  }

  function handleTap() {
    if (tapCount >= 3) refreshAll();
    else if (tapCount === 2) showBalance();
    else cycleLook();
    tapCount = 0;
  }

  sprite.addEventListener("pointerdown", (e) => {
    dragging = true;
    moved = false;
    longPressed = false;
    startX = e.screenX; startY = e.screenY;
    lastX = e.screenX; lastY = e.screenY;
    sprite.classList.add("pressed");
    playSound("assets/Ya1.mp3", 0.5);
    ipcRenderer.invoke(CH + "set-dragging", { dragging: true }).catch(() => {});
    try {
      sprite.setPointerCapture(e.pointerId);
      sprite.addEventListener("lostpointercapture", stopDrag, { once: true });
    } catch (err) {}
    if (pressTimer) clearTimeout(pressTimer);
    pressTimer = setTimeout(() => {
      pressTimer = null;
      if (!dragging || moved) return;
      longPressed = true;
      expandTasks();
      playSound("assets/Ya2.mp3", 0.42);
    }, 620);
  });

  sprite.addEventListener("pointermove", (e) => {
    if (!dragging) return;
    // 兜底：pointerup 丢失时，按键已经松开也要立刻结束拖拽
    if (e.buttons === 0) { stopDrag(); return; }
    const dx = e.screenX - lastX;
    const dy = e.screenY - lastY;
    lastX = e.screenX; lastY = e.screenY;
    if (Math.abs(e.screenX - startX) > 4 || Math.abs(e.screenY - startY) > 4) {
      moved = true;
      if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; }
    }
    if (moved && (dx || dy)) {
      pendingDx += dx; pendingDy += dy;
      if (!rafPending) { rafPending = true; requestAnimationFrame(flushMove); }
    }
  });

  function stopDrag() {
    if (!dragging) return;
    dragging = false;
    sprite.classList.remove("pressed");
    if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; }
    ipcRenderer.invoke(CH + "set-dragging", { dragging: false }).catch(() => {});
  }

  function endDrag() {
    if (!dragging) return;
    dragging = false;
    ipcRenderer.invoke(CH + "set-dragging", { dragging: false }).catch(() => {});
    sprite.classList.remove("pressed");
    if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; }
    playSound("assets/Ya2.mp3", 0.5);
    if (moved) return;
    if (longPressed) { longPressed = false; return; }
    tapCount += 1;
    if (tapTimer) clearTimeout(tapTimer);
    tapTimer = setTimeout(() => {
      tapTimer = null;
      handleTap();
    }, 340);
  }

  sprite.addEventListener("pointerup", endDrag);
  sprite.addEventListener("pointercancel", stopDrag);
  document.addEventListener("pointerup", endDrag, true);
  window.addEventListener("blur", stopDrag);

  sprite.addEventListener("contextmenu", (e) => {
    e.preventDefault();
    ipcRenderer.invoke(CH + "showMenu").catch(() => {});
  });

  ipcRenderer.on("menu-action", (e, type) => {
    if (type === "talk") { setFace("rua", 780); saySomething(); }
    else if (type === "next-pose") cycleLook();
    else if (type === "config-changed") void loadConfig();
    else if (type === "zoom-in") changeScale(1);
    else if (type === "zoom-out") changeScale(-1);
    else if (type === "refresh") load(true);
    else if (type === "custom-limit") {
      const current = lastData && Number(lastData.budget) > 0 ? String(Number(lastData.budget)) : "30";
      const input = window.prompt("今日额度上限（元，填 0 表示关闭提醒）", current);
      if (input === null) return;
      const value = Number(input);
      if (!Number.isFinite(value) || value < 0) return;
      ipcRenderer
        .invoke(CH + "setLimit", value)
        .then((res) => {
          if (res && res.payload) render(res.payload);
        })
        .catch(() => {});
    }
    else if (type === "custom-bubble-width" || type === "custom-bubble-height") {
      const isWidth = type === "custom-bubble-width";
      const key = isWidth ? "bubbleWidth" : "bubbleHeight";
      const label = isWidth ? "气泡宽度" : "气泡高度";
      const current = Number(isWidth ? CONFIG.bubbleWidth : CONFIG.bubbleHeight) || 0;
      const input = window.prompt(label + "（px，0–1400，0 表示随内容自适应）", String(current));
      if (input === null) return;
      const value = Math.max(0, Math.min(1400, Math.round(Number(input) || 0)));
      const patch = {};
      patch[key] = value;
      ipcRenderer
        .invoke(CH + "settings-set", patch)
        .then(() => loadConfig())
        .catch(() => {});
    }
    else if (type === "close") ipcRenderer.invoke(CH + "close").catch(() => {});
  });

  ipcRenderer.on("config-changed", () => {
    void loadConfig();
  });

  /* ---------- 配置 ---------- */
  async function loadConfig() {
    try {
      const c = await ipcRenderer.invoke(CH + "config");
      if (c) {
        if (typeof c.stickerDuration === "number") CONFIG.stickerDuration = c.stickerDuration;
        if (c.stickerPlacement) CONFIG.stickerPlacement = c.stickerPlacement;
        if (c.bubbleSize) CONFIG.bubbleSize = c.bubbleSize;
        if (typeof c.bubbleWidth === "number") CONFIG.bubbleWidth = c.bubbleWidth;
        if (typeof c.bubbleHeight === "number") CONFIG.bubbleHeight = c.bubbleHeight;
        if (c.bubbleMode) CONFIG.bubbleMode = c.bubbleMode;
        if (c.bubblePlace) CONFIG.bubblePlace = c.bubblePlace;
        if (typeof c.bubbleFont === "number") CONFIG.bubbleFont = c.bubbleFont;
        if (typeof c.talkFont === "number") CONFIG.talkFont = c.talkFont;
        if (typeof c.stickerSize === "number") CONFIG.stickerSize = c.stickerSize;
        if (typeof c.rotateSec === "number") CONFIG.rotateSec = c.rotateSec;
        if (typeof c.poseRotate === "boolean") CONFIG.poseRotate = c.poseRotate;
        if (typeof c.poseSec === "number") CONFIG.poseSec = c.poseSec;
        if (typeof c.taskFont === "number") CONFIG.taskFont = c.taskFont;
        if (typeof c.taskListHeight === "number") CONFIG.taskListHeight = c.taskListHeight;
        if (typeof c.hudEnabled === "boolean") CONFIG.hudEnabled = c.hudEnabled;
        if (["full", "simple", "simple2"].includes(c.hudDetail)) CONFIG.hudDetail = c.hudDetail;
      }
    } catch (e) {}
    applySizes();
    mountSticker();
    startRotate();
    schedulePose();
    if (lastData) render(lastData);
  }

  /* ---------- 数据 / 缩放 ---------- */
  async function load(refresh) {
    try {
      const data = await ipcRenderer.invoke(CH + (refresh ? "refresh" : "get"));
      render(data);
    } catch (e) {
      presentTalk("读取失败", "serious", "sad");
    }
  }
  async function changeScale(dir) {
    const idx = SCALES.indexOf(scale);
    const next = SCALES[Math.max(0, Math.min(SCALES.length - 1, (idx < 0 ? 2 : idx) + dir))];
    if (next === scale) return;
    try {
      const applied = await ipcRenderer.invoke(CH + "setScale", next);
      applyScale(typeof applied === "number" ? applied : next);
    } catch (e) {
      applyScale(next);
    }
  }

  /* ---------- 启动 ---------- */
  (async () => {
    try {
      const s = await ipcRenderer.invoke(CH + "scale");
      if (typeof s === "number" && s > 0) applyScale(s);
    } catch (e) {}
    await loadConfig();
    refreshHud();
    await load(false);
    applyPose(0);
    setTimeout(() => {
      presentInfo(true);
      showSticker("greet");
    }, 500);
  })();

  setInterval(() => load(false), 30000);

  setInterval(() => {
    if (lastData && lastData.ok && !infoBubble.classList.contains("show")) {
      const text = chooseLine(lastData);
      infoLine.textContent = text;
    }
  }, 15000);

  setInterval(() => {
    if (["info", "today", "balance"].includes(CONFIG.bubbleMode)) return;
    if (!lastData) return;
    const q = pick(QUESTIONS);
    presentTalk(q.t, q.face, q.mood);
  }, 6 * 60 * 1000);

  setTimeout(() => {
    if (lastData) {
      const q = pick(QUESTIONS);
      presentTalk(q.t, q.face, q.mood);
    }
  }, 90 * 1000);
</script>
</body>
</html>
